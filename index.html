<style>

  .modo.resumo:hover { border-color: var(--roxo); } .modo.resumo .m-nome { color: var(--roxo); }

  pre .kw { color: #ff9db8; } pre .fn { color: #7db9ff; } pre .str { color: #a5e8b0; } pre .cm { color: #6b7d94; font-style: italic; } pre .num { color: #f5c563; } pre .an { color: #e8c14f; }

  .opcao .txt { display: block; min-height: 3.1em; }

  .letra { flex-shrink: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; color: var(--dim); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-top: 1px; transition: all 0.15s; }
  .opcao:hover:not(:disabled) .letra { color: var(--verde); border-color: var(--verde); }

  .explicacao .tag { color: var(--verde); font-weight: 800; margin-right: 6px; }
  .explicacao.err .tag { color: var(--vermelho); } .explicacao.err { border-left-color: var(--vermelho); }
  .botao { display: none; margin-top: 20px; background: var(--dourado); color: #1a1400; border: none; font-family: inherit; font-weight: 800; font-size: 0.85rem; padding: 13px 28px; border-radius: 10px; cursor: pointer; transition: transform 0.1s, filter 0.15s; }
  .botao:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .botao.mostrar { display: inline-block; animation: entrar 0.3s ease; }
  .botao.secundario { background: transparent; color: var(--dim); border: 1px solid var(--border); margin-left: 8px; }
  .botao.secundario:hover { color: var(--texto); border-color: var(--dim); }
  .dica-teclado { font-size: 0.68rem; color: #4a5568; margin-top: 14px; }
  .resultado { text-align: center; }
  .anel { width: 140px; height: 140px; margin: 10px auto 18px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(closest-side, var(--card) 82%, transparent 83%), conic-gradient(var(--verde) calc(var(--pct) * 1%), var(--border) 0); }
  .anel .num { font-size: 1.8rem; font-weight: 800; color: var(--verde); }
  .anel .sub { font-size: 0.7rem; color: var(--dim); }
  .veredito { color: var(--texto); font-size: 0.95rem; margin-bottom: 4px; font-weight: 600; }
  .veredito-sub { color: var(--dim); font-size: 0.8rem; margin-bottom: 24px; }
  .revisao { text-align: left; margin-top: 8px; }
  .revisao h3 { font-size: 0.8rem; color: var(--vermelho); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .rev-item { background: var(--card2); border: 1px solid var(--border); border-left: 3px solid var(--vermelho); border-radius: 8px; padding: 13px 15px; margin-bottom: 9px; font-size: 0.78rem; line-height: 1.6; }
  .rev-item .q { color: var(--texto); margin-bottom: 6px; }
  .rev-item .r { color: var(--dim); } .rev-item .r b { color: var(--verde); font-weight: 600; }
  .resumo-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .resumo-topo h2 { font-size: 1.15rem; font-weight: 800; color: var(--roxo); }
  .resumo-tag { font-size: 0.7rem; color: var(--dim); background: var(--card2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 99px; }
  .resumo-corpo { font-size: 0.88rem; line-height: 1.75; color: var(--texto); }
  .resumo-corpo p { margin-bottom: 14px; } .resumo-corpo b { color: var(--dourado); }
  .resumo-corpo .destaque { display: block; background: #05090f; border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin: 4px 0 16px; font-size: 0.82rem; color: #cdd7e3; line-height: 1.7; }
  .resumo-corpo .destaque code { background: rgba(255,255,255,0.08); color: #ff9db8; }
  .resumo-lista { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .resumo-nav { font-size: 0.72rem; color: var(--dim); background: var(--card2); border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .resumo-nav:hover { color: var(--texto); border-color: var(--dim); }
  .resumo-nav.ativo { color: var(--roxo); border-color: var(--roxo); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="navbar" id="navbar"></div>

  <div class="card" id="card"></div>
</div>

<script>
  /* =========================== MODO FÁCIL (18) =========================== */
  const facil = [
    { tema: "Compose · @Composable", pergunta: "O que a anotação <code>@Composable</code> faz em uma função Kotlin?",
      opcoes: [
        "Marca a função como capaz de emitir interface (UI) no Jetpack Compose — ela só pode ser chamada de dentro de outra Composable ou do <code>setContent</code>.",
        "Transforma a função em uma coroutine que roda em segundo plano, liberando a thread principal do aplicativo.",
        "Define a função como uma rota de API, associando um endereço HTTP ao código escrito logo abaixo dela.",
        "Converte a função em uma tabela do banco de dados, gerando colunas a partir dos seus parâmetros."
      ], correta: 0, explicacao: "<code>@Composable</code> marca a função como geradora de UI. Por convenção usa PascalCase e só roda dentro do <code>setContent</code> ou de outra Composable." },
    { tema: "Compose · declarativo", pergunta: "Qual princípio resume a UI no Jetpack Compose?",
      opcoes: [
        "<code>UI = f(state)</code> — a interface é função do estado; muda o estado, a tela se atualiza sozinha.",
        "<code>UI = HTML + CSS</code> — a tela é montada com marcação e folhas de estilo, como em páginas web.",
        "<code>UI = SQL</code> — a interface é gerada diretamente a partir das consultas feitas ao banco de dados.",
        "<code>UI = loop</code> — a tela é redesenhada manualmente dentro de um laço infinito em execução."
      ], correta: 0, explicacao: "Compose é declarativo: <code>UI = f(state)</code>. Você descreve como a tela deve ficar para cada estado, em vez de atualizar widgets manualmente." },
    { tema: "Compose · remember", pergunta: "Para que serve o <code>remember { }</code> no Compose?",
      opcoes: [
        "Preserva um valor na memória entre recomposições — sem ele, a variável voltaria ao valor inicial a cada redesenho.",
        "Salva o valor permanentemente no banco de dados do dispositivo, mantendo-o mesmo após fechar o app.",
        "Memoriza o último endpoint de API acessado, evitando repetir a mesma requisição de rede.",
        "Guarda o histórico de navegação entre telas para permitir voltar à tela anterior."
      ], correta: 0, explicacao: "<code>remember</code> preserva o valor entre recomposições. Sem ele, a cada redesenho a variável voltaria ao valor inicial." },
    { tema: "Compose · mutableStateOf", pergunta: "O que <code>mutableStateOf()</code> cria no Compose?",
      opcoes: [
        "Um \"envelope observável\": quando o valor muda, o Compose é notificado para recompor quem usa esse estado.",
        "Uma constante imutável que nunca pode ter o seu valor alterado durante a execução do aplicativo.",
        "Uma conexão com o banco de dados SQLite para ler e gravar valores de forma persistente.",
        "Uma função de rede que busca o valor inicial em uma API externa antes de exibir a tela."
      ], correta: 0, explicacao: "<code>mutableStateOf()</code> cria um estado observável. Ao mudar o valor, o Compose recompõe automaticamente os componentes que o leem." },
    { tema: "Compose · Column", pergunta: "O que o layout <code>Column</code> faz no Compose?",
      opcoes: [
        "Empilha os elementos verticalmente, de cima para baixo.",
        "Empilha os elementos horizontalmente, da esquerda para a direita.",
        "Sobrepõe os elementos em profundidade (um por cima do outro).",
        "Organiza os elementos automaticamente em uma grade de linhas e colunas."
      ], correta: 0, explicacao: "<code>Column</code> empilha na vertical. <code>Row</code> empilha na horizontal e <code>Box</code> sobrepõe (Z-order)." },
    { tema: "Compose · Row", pergunta: "O que o layout <code>Row</code> faz no Compose?",
      opcoes: [
        "Empilha os elementos horizontalmente, da esquerda para a direita.",
        "Empilha os elementos verticalmente, de cima para baixo.",
        "Sobrepõe os elementos uns sobre os outros em camadas de profundidade.",
        "Divide a tela em duas metades iguais, uma para cada elemento filho."
      ], correta: 0, explicacao: "<code>Row</code> organiza na horizontal (lado a lado). <code>Column</code> é na vertical e <code>Box</code> sobrepõe." },
    { tema: "Compose · Box", pergunta: "Qual é a característica do layout <code>Box</code>?",
      opcoes: [
        "Sobrepõe os elementos em profundidade (Z-order), permitindo um por cima do outro — útil para badges e overlays.",
        "Enfileira os elementos em uma única linha horizontal, sem permitir sobreposição alguma.",
        "Cria uma caixa de texto editável onde o usuário digita informações no aplicativo.",
        "Guarda uma lista de itens em memória para serem exibidos posteriormente na tela."
      ], correta: 0, explicacao: "<code>Box</code> sobrepõe elementos em profundidade (Z-order). Bom para colocar um elemento sobre o outro, como um selo sobre uma imagem." },
    { tema: "Compose · Modifier", pergunta: "Para que servem os <code>Modifier</code> no Compose?",
      opcoes: [
        "Decoram e posicionam os componentes (padding, background, tamanho...) — e a ordem na cadeia importa.",
        "Definem as rotas de navegação entre as telas do aplicativo em execução.",
        "Convertem respostas JSON da API em objetos Kotlin automaticamente.",
        "Criam as tabelas do banco de dados a partir das propriedades de uma classe."
      ], correta: 0, explicacao: "<code>Modifier</code> decora/posiciona: <code>padding</code>, <code>background</code>, <code>fillMaxWidth</code>... Aplicados em cadeia, e a ordem altera o resultado." },
    { tema: "SQLite", pergunta: "O que é o <b>SQLite</b> no Android?",
      opcoes: [
        "Um banco de dados relacional leve, embutido no Android, que não precisa de bibliotecas externas.",
        "Uma biblioteca para fazer requisições HTTP e consumir APIs da internet no aplicativo.",
        "O sistema de temas visuais do Material Design usado para estilizar a interface do app.",
        "Um emulador de Android usado para testar o aplicativo sem precisar de um celular físico."
      ], correta: 0, explicacao: "SQLite é um banco relacional leve e embutido no Android — \"provavelmente o banco mais distribuído do mundo\". Não precisa de servidor externo." },
    { tema: "Room", pergunta: "O que é o <b>Room</b> no Android?",
      opcoes: [
        "Uma camada de abstração sobre o SQLite que automatiza o schema e as queries por meio de anotações.",
        "Uma biblioteca de animações para criar transições suaves entre as telas do aplicativo.",

        "Um gerenciador de navegação que controla a pilha de telas do aplicativo Android."
      ], correta: 0, explicacao: "Room é uma camada sobre o SQLite: com anotações (@Entity, @Dao, @Database) ele automatiza tabelas e consultas, evitando escrever SQL manualmente." },
    { tema: "Room · @Entity", pergunta: "O que a anotação <code>@Entity</code> faz no Room?",
      opcoes: [
        "Marca uma data class como uma tabela do banco — cada propriedade vira uma coluna.",
        "Marca uma função como uma requisição HTTP do tipo GET para uma API externa.",
        "Define uma função Composable que desenha a interface da tela de cadastro.",
        "Cria uma coroutine que executa a operação em segundo plano, fora da thread principal."
      ], correta: 0, explicacao: "<code>@Entity</code> transforma uma data class em tabela do banco. Cada propriedade da classe vira uma coluna da tabela." },
    { tema: "Room · @Dao", pergunta: "O que é um <code>@Dao</code> no Room?",

        "Uma interface que define as operações do banco: inserir, consultar, atualizar e excluir.",
        "A classe principal que representa o aplicativo e inicia a primeira tela ao abrir.",
        "Um objeto que guarda o estado da UI e sobrevive à rotação da tela do dispositivo.",
        "Uma função que converte respostas JSON da API em objetos Kotlin para exibição."
      ], correta: 0, explicacao: "DAO (Data Access Object) é a interface com as operações do banco: <code>@Insert</code>, <code>@Query</code>, <code>@Update</code>, <code>@Delete</code>." },
    { tema: "Retrofit", pergunta: "O que é o <b>Retrofit</b> no Android?",
      opcoes: [
        "Um cliente HTTP type-safe que declara endpoints por anotações e converte o JSON em objetos Kotlin.",

        "Uma biblioteca de layout que organiza os componentes da tela em linhas e colunas.",
        "Um sistema de autenticação que gerencia o login e a senha dos usuários do app."
      ], correta: 0, explicacao: "Retrofit é um cliente HTTP type-safe: declara as rotas da API por anotações (@GET, @Path...) e converte o JSON em objetos Kotlin automaticamente." },
    { tema: "Retrofit · @GET", pergunta: "O que a anotação <code>@GET</code> faz no Retrofit?",
      opcoes: [
        "Marca a função como uma requisição HTTP do tipo GET para buscar dados de uma API.",
        "Marca a função como uma consulta SQL que busca registros no banco de dados local.",
        "Define a função como uma Composable que exibe os dados recebidos na tela.",
        "Cria uma variável de estado observável que atualiza a tela quando muda."
      ], correta: 0, explicacao: "<code>@GET</code> marca a função como requisição GET. O caminho (ex.: <code>pokemon/{nameOrId}</code>) define o endpoint acessado." },
    { tema: "ViewModel", pergunta: "Para que serve o <code>ViewModel</code> no Android?",
      opcoes: [
        "Guardar o estado da tela e sobreviver a mudanças de configuração, como a rotação do dispositivo.",
        "Desenhar os componentes visuais da interface, definindo cores, botões e textos da tela.",
        "Executar diretamente as consultas SQL no banco de dados SQLite do aplicativo.",
        "Armazenar permanentemente os dados em disco, mesmo depois que o app é encerrado."

    { tema: "Coroutines · suspend", pergunta: "O que uma função marcada com <code>suspend</code> permite no Kotlin?",

    { tema: "Design Patterns", pergunta: "Em quantas categorias os padrões de projeto (design patterns) se dividem?",
      opcoes: [
        "Três: criacionais, estruturais e comportamentais.",

    { tema: "Singleton", pergunta: "O que o padrão <b>Singleton</b> garante?",

    { titulo: "UI State e arquitetura", tag: "MVVM + UDF", corpo: `<p>O estado da tela é modelado como uma <b>sealed interface</b>, garantindo um único estado válido por vez:</p>
<span class="destaque">sealed interface UiState {<br>&nbsp;&nbsp;object Loading<br>&nbsp;&nbsp;data class Success(val p: Pokemon)<br>&nbsp;&nbsp;object Error<br>}</span>
<p><b>MVVM + fluxo unidirecional (UDF):</b> dados descem (API → ViewModel → UI), eventos sobem por callbacks. O ViewModel nunca conhece a UI.</p>` },
    { titulo: "Caminho completo dos dados", tag: "juntando tudo", corpo: `<p>A arquitetura Android completa conecta todas as camadas:</p>
<span class="destaque">API (Retrofit) → grava no Room → ViewModel observa (Flow) → UI (Compose) exibe</span>
<p>A API alimenta o banco; o Room é a <b>fonte única da verdade</b>; o ViewModel expõe o estado; o Compose desenha em função desse estado. Tudo assíncrono via coroutines.</p>` },
    { titulo: "Padrões de Projeto", tag: "design patterns", corpo: `<p>Soluções reutilizáveis para problemas comuns, em <b>3 categorias</b>:</p>
<span class="destaque">Criacionais → criação de objetos: Singleton, Factory Method, Builder, Abstract Factory, Prototype<br>Estruturais → composição: Adapter, Decorator, Facade, Proxy, Composite<br>Comportamentais → interação: Observer, Strategy, Command, State</span>
<p><b>Singleton</b> (1 instância): em Kotlin, <code>object</code>. <b>Observer</b> (notifica mudanças): a base do Flow/estado reativo. <b>Strategy</b>: algoritmos intercambiáveis.</p>` }
  ];

  const modos = {
    facil:   { nome: "Fácil",   tipo: "quiz",   questoes: facil },
    medio:   { nome: "Médio",   tipo: "quiz",   questoes: medio },
    dificil: { nome: "Difícil", tipo: "quiz",   questoes: dificil },
    codigo:  { nome: "Código",  tipo: "quiz",   questoes: codigo },
    resumo:  { nome: "Resumo",  tipo: "resumo", questoes: resumo }
  };

  const temasChips = ["Jetpack Compose", "Estado", "SQLite", "Room", "Retrofit/API", "Coroutines", "ViewModel", "Design Patterns"];

  let modoAtual = null, questoes = [], atual = 0, acertos = 0, ordemAtual = [], respondida = false, erros = [], iniciado = false, respostasDadas = [];

  const navbar = document.getElementById("navbar");
  const card = document.getElementById("card");
  const barra = document.getElementById("barra");
  const contador = document.getElementById("contador");
  const placar = document.getElementById("placar");

  function embaralhar(n) {
    const arr = [...Array(n).keys()];
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }

  function renderNavbar() {
    if (!iniciado) { navbar.innerHTML = ""; return; }
    const ehResumo = modos[modoAtual].tipo === "resumo";
    const podeVoltar = atual > 0;
    navbar.innerHTML = `
      <button class="nav-btn home" onclick="telaInicial()">⌂ Início</button>
      <button class="nav-btn" onclick="voltarQuestao()" ${podeVoltar ? "" : "disabled"}>← ${ehResumo ? "Anterior" : "Questão anterior"}</button>
      <span class="nav-spacer"></span>
      <span class="nav-modo">modo: <b>${modos[modoAtual].nome}</b></span>`;
  }

  function telaInicial() {
    iniciado = false; modoAtual = null; renderNavbar();
    barra.style.width = "0%"; contador.textContent = ""; placar.textContent = "";
    card.innerHTML = `
      <div class="hero">
        <h1>&gt; Prova Kotlin<br><span>Android: Compose, Room & API</span></h1>
        <p class="desc">Jetpack Compose (estado, recomposição, modifiers), persistência (SQLite e Room), consumo de API com Retrofit e padrões de projeto. Nos quizzes as alternativas embaralham e a explicação aparece na hora. O modo Resumo é material de estudo.</p>
        <div class="chips">${temasChips.map(t => `<span class="chip">${t}</span>`).join("")}</div>
        <div class="modos">
          <button class="modo facil" onclick="iniciar('facil')"><span class="m-icone">🟢</span><span class="m-nome">Fácil</span><span class="m-desc">18 questões · conceitos e definições básicas</span></button>
          <button class="modo medio" onclick="iniciar('medio')"><span class="m-icone">🟡</span><span class="m-nome">Médio</span><span class="m-desc">18 questões · aplicação prática dos conceitos</span></button>
          <button class="modo dificil" onclick="iniciar('dificil')"><span class="m-icone">🔴</span><span class="m-nome">Difícil</span><span class="m-desc">20 questões · mecanismos, arquitetura e pegadinhas</span></button>
          <button class="modo codigo" onclick="iniciar('codigo')"><span class="m-icone">💻</span><span class="m-nome">Código</span><span class="m-desc">16 trechos · leia o código e acerte o que ele faz</span></button>
          <button class="modo resumo" onclick="iniciar('resumo')"><span class="m-icone">📖</span><span class="m-nome">Resumo</span><span class="m-desc">12 tópicos · material de estudo, sem quiz</span></button>
        </div>
        <p class="dica-teclado">atalhos nos quizzes: 1–4 responde · Enter avança · ← volta</p>
      </div>`;
  }

  function iniciar(modo) {
    modoAtual = modo; questoes = modos[modo].questoes; iniciado = true;
    atual = 0; acertos = 0; erros = [];
    respostasDadas = new Array(questoes.length).fill(null);
    if (modos[modo].tipo === "resumo") mostrarResumo(); else mostrarQuestao();
  }

  function voltarQuestao() {
    if (atual === 0) return;
    atual--;
    if (modos[modoAtual].tipo === "resumo") { mostrarResumo(); return; }
    if (respostasDadas[atual] !== null) {
      const q = questoes[atual];
      if (respostasDadas[atual] === q.correta) acertos = Math.max(0, acertos - 1);
      erros = erros.filter(e => e !== q);
      respostasDadas[atual] = null;
    }
    mostrarQuestao();
  }

  function mostrarQuestao() {
    const q = questoes[atual];
    respondida = false;
    ordemAtual = embaralhar(q.opcoes.length);
    renderNavbar();
    barra.style.width = `${(atual / questoes.length) * 100}%`;
    contador.textContent = `[${modos[modoAtual].nome.toLowerCase()}] questão ${String(atual + 1).padStart(2, "0")} / ${questoes.length}`;
    placar.textContent = `${acertos} acerto${acertos === 1 ? "" : "s"}`;
    const bloco = q.trecho ? `<pre>${q.trecho}</pre>` : "";
    card.innerHTML = `
      <span class="tema">◆ ${q.tema}</span>
      ${bloco}
      <div class="pergunta">${q.pergunta}</div>
      ${ordemAtual.map((idxOriginal, pos) => `
        <button class="opcao" data-pos="${pos}" onclick="responder(${idxOriginal})">
          <span class="letra">${String.fromCharCode(65 + pos)}</span>
          <span class="txt">${q.opcoes[idxOriginal]}</span>
        </button>`).join("")}
      <div class="explicacao" id="explicacao"></div>
      <button class="botao" id="proxima" onclick="proxima()">Próxima →</button>`;
  }

  function responder(idxOriginal) {
    if (respondida) return;
    respondida = true;
    const q = questoes[atual];
    respostasDadas[atual] = idxOriginal;
    const botoes = card.querySelectorAll(".opcao");
    botoes.forEach(b => b.disabled = true);
    const posCorreta = ordemAtual.indexOf(q.correta);
    const posClicada = ordemAtual.indexOf(idxOriginal);
    const acertou = idxOriginal === q.correta;
    botoes[posCorreta].classList.add("correta");
    botoes.forEach((b, i) => { if (i !== posCorreta && i !== posClicada) b.classList.add("apagada"); });
    const exp = document.getElementById("explicacao");
    if (acertou) { acertos++; exp.innerHTML = `<span class="tag">✓ ACERTOU</span>${q.explicacao}`; }
    else { botoes[posClicada].classList.add("errada"); exp.classList.add("err"); exp.innerHTML = `<span class="tag">✗ ERROU</span>${q.explicacao}`; erros.push(q); }
    exp.style.display = "block";
    const btn = document.getElementById("proxima");
    if (atual === questoes.length - 1) btn.textContent = "Ver resultado →";
    btn.classList.add("mostrar");
    placar.textContent = `${acertos} acerto${acertos === 1 ? "" : "s"}`;
  }

  function proxima() {
    atual++;
    if (atual < questoes.length) mostrarQuestao(); else mostrarResultado();
  }

  function mostrarResultado() {
    renderNavbar();
    barra.style.width = "100%";
    contador.textContent = `[${modos[modoAtual].nome.toLowerCase()}] resultado`;
    placar.textContent = "";
    const pct = Math.round((acertos / questoes.length) * 100);
    let veredito, sub;
    if (pct >= 90)      { veredito = "Monstro. 🏆";                sub = modoAtual === "dificil" ? "Pode fazer a prova de olhos fechados." : "Bora subir de nível — tenta o próximo modo."; }
    else if (pct >= 70) { veredito = "Tá pronto pra prova. 🤖";    sub = "Só dá uma olhada nos erros abaixo."; }
    else if (pct >= 50) { veredito = "Na média, mas dá pra mais."; sub = "Revisa os tópicos das questões erradas."; }
    else                { veredito = "Volta pra teoria. 📚";       sub = "Dá uma passada no modo Resumo e refaz."; }
    card.innerHTML = `
      <div class="resultado">
        <div class="anel" style="--pct: ${pct}"><span class="num">${acertos}/${questoes.length}</span><span class="sub">${pct}%</span></div>
        <p class="veredito">${veredito}</p>
        <p class="veredito-sub">${sub}</p>
        <button class="botao mostrar" onclick="iniciar(modoAtual)">Refazer ↻</button>
        <button class="botao secundario mostrar" onclick="telaInicial()">Trocar modo</button>
      </div>
      ${erros.length ? `
        <div class="revisao">
          <h3>Pra revisar (${erros.length})</h3>
          ${erros.map(q => `
            <div class="rev-item">
              <div class="q">◆ [${q.tema}] ${q.pergunta.split("<pre>")[0]}</div>
              <div class="r"><b>Resposta:</b> ${q.opcoes[q.correta]}</div>
            </div>`).join("")}
        </div>` : ""}`;
  }

  function mostrarResumo() {
    const r = resumo[atual];
    renderNavbar();
    barra.style.width = `${((atual + 1) / resumo.length) * 100}%`;
    contador.textContent = `[resumo] tópico ${String(atual + 1).padStart(2, "0")} / ${resumo.length}`;
    placar.textContent = "";
    const ehUltimo = atual === resumo.length - 1;
    card.innerHTML = `
      <div class="resumo-topo"><h2>${r.titulo}</h2><span class="resumo-tag">${r.tag}</span></div>
      <div class="resumo-corpo">${r.corpo}</div>
      <div class="resumo-lista">
        ${resumo.map((t, i) => `<button class="resumo-nav ${i === atual ? "ativo" : ""}" onclick="irResumo(${i})">${i + 1}. ${t.titulo}</button>`).join("")}
      </div>
      <button class="botao mostrar" onclick="${ehUltimo ? "telaInicial()" : "proximoResumo()"}">${ehUltimo ? "Concluir ✓" : "Próximo tópico →"}</button>`;
  }

  function proximoResumo() { if (atual < resumo.length - 1) { atual++; mostrarResumo(); } }
  function irResumo(i) { atual = i; mostrarResumo(); }

  document.addEventListener("keydown", (e) => {
    if (!iniciado) {
      const map = { "1": "facil", "2": "medio", "3": "dificil", "4": "codigo", "5": "resumo" };
      if (map[e.key]) iniciar(map[e.key]);
      return;
    }
    const tipo = modos[modoAtual].tipo;
    if (tipo === "resumo") {
      if (e.key === "ArrowRight") proximoResumo();
      else if (e.key === "ArrowLeft") voltarQuestao();
      return;
    }
    if (!respondida && ["1","2","3","4"].includes(e.key)) {
      const pos = parseInt(e.key) - 1;
      if (pos < ordemAtual.length) responder(ordemAtual[pos]);
    } else if (respondida && e.key === "Enter") { proxima(); }
    else if (e.key === "ArrowLeft") { voltarQuestao(); }
  });

  telaInicial();
</script>
</body>
</html>
