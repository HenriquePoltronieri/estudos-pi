<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Quiz Flutter — Integração & Persistência</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a12; --card: #0f1826; --card2: #16202f; --border: #263447;
    --texto: #e4e9f0; --dim: #8494a8; --azulesc: #7db9ff;
    --verde: #4ade80; --verde-soft: rgba(74, 222, 128, 0.1);

  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 50% -20%, rgba(125, 185, 255, 0.06), transparent 60%);
    color: var(--texto); font-family: 'JetBrains Mono', monospace;
    min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px;
  }
  .app { width: 100%; max-width: 760px; }
  .topbar { height: 6px; background: linear-gradient(90deg, #1a3a5c 0%, #1a3a5c 55%, var(--dourado) 100%); border-radius: 99px; margin-bottom: 18px; }
  .navbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; min-height: 36px; }
  .nav-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); color: var(--dim); font-family: inherit; font-size: 0.72rem; font-weight: 600; padding: 8px 13px; border-radius: 8px; cursor: pointer; transition: color 0.15s, border-color 0.15s, transform 0.1s; }
  .nav-btn:hover:not(:disabled) { color: var(--texto); border-color: var(--dim); transform: translateY(-1px); }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .nav-btn.home:hover:not(:disabled) { color: var(--azulesc); border-color: var(--azulesc); }
  .nav-spacer { flex: 1; }
  .nav-modo { font-size: 0.7rem; color: var(--dim); background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 99px; }
  .nav-modo b { color: var(--texto); }
  .barra-wrap { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .barra { height: 100%; width: 0%; background: linear-gradient(90deg, var(--dourado), #f5d97e); border-radius: 99px; transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  .topo { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--dim); margin-bottom: 10px; }
  .topo .placar { color: var(--verde); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3); animation: entrar 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .hero h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.3; color: var(--texto); }
  .hero h1 span { color: var(--dourado); }
  .hero .desc { color: var(--dim); font-size: 0.85rem; margin: 14px 0 20px; line-height: 1.6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .chip { font-size: 0.7rem; color: var(--dim); background: var(--card2); border: 1px solid var(--border); padding: 5px 10px; border-radius: 99px; }
  .modos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
  @media (max-width: 560px) { .modos { grid-template-columns: 1fr; } }
  .modo { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 14px; cursor: pointer; font-family: inherit; color: var(--texto); text-align: left; transition: border-color 0.15s, transform 0.1s; }
  .modo:hover { transform: translateY(-2px); }
  .modo .m-icone { font-size: 1.2rem; display: block; margin-bottom: 8px; }
  .modo .m-nome { font-weight: 800; font-size: 0.88rem; display: block; margin-bottom: 4px; }
  .modo .m-desc { font-size: 0.67rem; color: var(--dim); line-height: 1.5; display: block; }
  .modo.facil:hover { border-color: var(--verde); } .modo.facil .m-nome { color: var(--verde); }
  .modo.medio:hover { border-color: var(--dourado); } .modo.medio .m-nome { color: var(--dourado); }
  .modo.dificil:hover { border-color: var(--vermelho); } .modo.dificil .m-nome { color: var(--vermelho); }
  .modo.codigo:hover { border-color: var(--azulesc); } .modo.codigo .m-nome { color: var(--azulesc); }
  .modo.resumo:hover { border-color: var(--roxo); } .modo.resumo .m-nome { color: var(--roxo); }
  .tema { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 600; color: var(--dourado); background: var(--dourado-soft); border: 1px solid rgba(232, 193, 79, 0.3); padding: 4px 12px; border-radius: 99px; margin-bottom: 16px; }
  .pergunta { font-size: 0.95rem; line-height: 1.65; margin-bottom: 22px; }
  .pergunta b { color: var(--dourado); }
  code { background: var(--card2); padding: 2px 6px; border-radius: 5px; color: var(--codigo); font-size: 0.85em; font-family: inherit; }
  pre { background: #05090f; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 14px 0 20px; overflow-x: auto; font-size: 0.8rem; line-height: 1.65; color: #e8eef5; }
  pre .kw { color: #ff9db8; } pre .fn { color: #7db9ff; } pre .str { color: #a5e8b0; } pre .cm { color: #6b7d94; font-style: italic; } pre .num { color: #f5c563; }
  .opcao { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--card2); border: 1px solid var(--border); color: var(--texto); font-family: inherit; font-size: 0.83rem; line-height: 1.55; padding: 13px 15px; border-radius: 10px; margin-bottom: 9px; cursor: pointer; transition: border-color 0.15s, transform 0.1s, background 0.15s; }
  .opcao .txt { display: block; min-height: 3.1em; }
  .opcao:hover:not(:disabled) { border-color: var(--verde); transform: translateX(3px); }
  .opcao:disabled { cursor: default; }
  .letra { flex-shrink: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; color: var(--dim); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-top: 1px; transition: all 0.15s; }
  .opcao:hover:not(:disabled) .letra { color: var(--verde); border-color: var(--verde); }
  .opcao.correta { border-color: var(--verde); background: var(--verde-soft); }
  .opcao.correta .letra { background: var(--verde); border-color: var(--verde); color: #052e16; }
  .opcao.errada { border-color: var(--vermelho); background: var(--vermelho-soft); }
  .opcao.errada .letra { background: var(--vermelho); border-color: var(--vermelho); color: #450a0a; }
  .opcao.apagada { opacity: 0.45; }
  .explicacao { display: none; margin-top: 18px; padding: 14px 16px; background: var(--card2); border: 1px solid var(--border); border-left: 3px solid var(--verde); border-radius: 8px; font-size: 0.82rem; line-height: 1.6; color: var(--dim); animation: entrar 0.3s ease; }
  .explicacao .tag { color: var(--verde); font-weight: 800; margin-right: 6px; }
  .explicacao.err .tag { color: var(--vermelho); } .explicacao.err { border-left-color: var(--vermelho); }
  .botao { display: none; margin-top: 20px; background: var(--dourado); color: #1a1400; border: none; font-family: inherit; font-weight: 800; font-size: 0.85rem; padding: 13px 28px; border-radius: 10px; cursor: pointer; transition: transform 0.1s, filter 0.15s; }
  .botao:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .botao.mostrar { display: inline-block; animation: entrar 0.3s ease; }
  .botao.secundario { background: transparent; color: var(--dim); border: 1px solid var(--border); margin-left: 8px; }
  .botao.secundario:hover { color: var(--texto); border-color: var(--dim); }
  .dica-teclado { font-size: 0.68rem; color: #4a5568; margin-top: 14px; }
  .resultado { text-align: center; }
  .anel { width: 140px; height: 140px; margin: 10px auto 18px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(closest-side, var(--card) 82%, transparent 83%), conic-gradient(var(--verde) calc(var(--pct) * 1%), var(--border) 0); }
  .anel .num { font-size: 1.8rem; font-weight: 800; color: var(--verde); }
  .anel .sub { font-size: 0.7rem; color: var(--dim); }
  .veredito { color: var(--texto); font-size: 0.95rem; margin-bottom: 4px; font-weight: 600; }
  .veredito-sub { color: var(--dim); font-size: 0.8rem; margin-bottom: 24px; }
  .revisao { text-align: left; margin-top: 8px; }
  .revisao h3 { font-size: 0.8rem; color: var(--vermelho); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .rev-item { background: var(--card2); border: 1px solid var(--border); border-left: 3px solid var(--vermelho); border-radius: 8px; padding: 13px 15px; margin-bottom: 9px; font-size: 0.78rem; line-height: 1.6; }
  .rev-item .q { color: var(--texto); margin-bottom: 6px; }
  .rev-item .r { color: var(--dim); } .rev-item .r b { color: var(--verde); font-weight: 600; }
  .resumo-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .resumo-topo h2 { font-size: 1.15rem; font-weight: 800; color: var(--roxo); }
  .resumo-tag { font-size: 0.7rem; color: var(--dim); background: var(--card2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 99px; }
  .resumo-corpo { font-size: 0.88rem; line-height: 1.75; color: var(--texto); }
  .resumo-corpo p { margin-bottom: 14px; } .resumo-corpo b { color: var(--dourado); }
  .resumo-corpo .destaque { display: block; background: #05090f; border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin: 4px 0 16px; font-size: 0.82rem; color: #cdd7e3; line-height: 1.7; }
  .resumo-corpo .destaque code { background: rgba(255,255,255,0.08); color: #ff9db8; }
  .resumo-lista { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .resumo-nav { font-size: 0.72rem; color: var(--dim); background: var(--card2); border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .resumo-nav:hover { color: var(--texto); border-color: var(--dim); }
  .resumo-nav.ativo { color: var(--roxo); border-color: var(--roxo); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="navbar" id="navbar"></div>
  <div class="barra-wrap"><div class="barra" id="barra"></div></div>
  <div class="topo"><span id="contador"></span><span class="placar" id="placar"></span></div>
  <div class="card" id="card"></div>
</div>

<script>
  /* =========================== MODO FÁCIL (18) =========================== */
  const facil = [
    { tema: "Arquitetura", pergunta: "No fluxo Service → Provider → Page, qual é a responsabilidade da <b>Page</b> (tela)?",
      opcoes: [
        "Mostrar os dados para o usuário na interface — a tela apenas exibe o que recebe do Provider, sem buscar dados por conta própria.",
        "Fazer a requisição HTTP diretamente para a API, receber o JSON e converter os dados antes de exibi-los na interface do aplicativo.",
        "Guardar o estado do aplicativo e controlar o carregamento, avisando as outras telas sempre que os dados forem alterados.",
        "Comunicar-se com o banco de dados SQLite, executando os comandos de INSERT, SELECT, UPDATE e DELETE conforme a necessidade."
      ], correta: 0, explicacao: "\"TELA MOSTRA. PROVIDER CONTROLA. SERVICE SE COMUNICA.\" A Page só exibe; quem busca dado é o Service e quem guarda estado é o Provider." },
    { tema: "Arquitetura", pergunta: "Qual é a responsabilidade da camada <b>Service</b> em um projeto Flutter que consome uma API?",
      opcoes: [
        "Fazer a comunicação: realizar a requisição HTTP, acessar a rota da API, receber o JSON e devolver os dados convertidos ao Provider.",
        "Exibir os dados na tela de forma organizada, montando os widgets e cuidando de todo o visual apresentado ao usuário final.",
        "Armazenar a lista de dados em memória e avisar as telas com <code>notifyListeners()</code> sempre que algo mudar no aplicativo.",
        "Definir as classes que representam as tabelas do banco, com seus campos e tipos, servindo de molde para os dados salvos."
      ], correta: 0, explicacao: "A Service sabe como buscar os dados: faz o HTTP, acessa a API e converte o JSON. As chamadas HTTP ficam sempre na pasta <code>services/</code>." },
    { tema: "Arquitetura", pergunta: "Qual é a responsabilidade da camada <b>Provider</b>?",
      opcoes: [
        "Guardar os dados, controlar o carregamento e os erros, chamar a Service e avisar as telas quando algo muda.",
        "Fazer diretamente a requisição HTTP para a API, dispensando qualquer outra camada intermediária no processo de busca de dados.",
        "Montar os widgets visuais da tela, definindo cores, botões e a disposição dos elementos exibidos ao usuário do aplicativo.",
        "Criar fisicamente as tabelas no banco de dados e executar os comandos SQL necessários para persistir cada registro do sistema."
      ], correta: 0, explicacao: "\"PROVIDER CONTROLA.\" Ele guarda os dados, controla estado/carregamento/erro, chama a Service e avisa as telas com <code>notifyListeners()</code>." },
    { tema: "Provider", pergunta: "De qual classe um Provider deve herdar para conseguir avisar as telas sobre mudanças?",
      opcoes: [
        "De <code>ChangeNotifier</code>, que fornece o mecanismo para notificar os widgets ouvintes quando os dados mudam.",
        "De <code>StatelessWidget</code>, pois o Provider é apenas uma tela sem estado que exibe os dados recebidos da Service.",
        "De <code>HttpClient</code>, já que a principal função do Provider é realizar as requisições HTTP para a API do projeto.",
        "De <code>Database</code>, porque o Provider é o responsável direto por abrir e manipular o banco de dados SQLite."
      ], correta: 0, explicacao: "O Provider usa <code>extends ChangeNotifier</code> e chama <code>notifyListeners()</code> para avisar as telas quando os dados mudam." },
    { tema: "Provider", pergunta: "Qual método o Provider chama para avisar as telas de que os dados foram atualizados?",
      opcoes: [
        "<code>notifyListeners()</code>, que dispara a reconstrução dos widgets que estão ouvindo aquele Provider.",
        "<code>setState()</code>, que é chamado dentro do próprio Provider para forçar todas as telas do app a se redesenharem juntas.",
        "<code>refresh()</code>, método padrão do <code>ChangeNotifier</code> usado especificamente para recarregar dados vindos de uma API.",
        "<code>update()</code>, que percorre a lista de widgets abertos e atualiza manualmente cada um deles um por vez na tela."
      ], correta: 0, explicacao: "<code>notifyListeners()</code> avisa os ouvintes. Dentro de um Provider (ChangeNotifier) não se usa <code>setState</code> — esse é dos widgets." },
    { tema: "PokéAPI · rota", pergunta: "Na atividade da Pokédex, qual rota Flask busca um Pokémon pelo nome?",
      opcoes: [
        "<code>GET /pokemons/nome/&lt;nome&gt;</code>, por exemplo <code>/pokemons/nome/pikachu</code>, que consulta a PokéAPI e devolve os dados do Pokémon.",
        "<code>POST /pokemons/buscar</code>, enviando o nome do Pokémon no corpo da requisição para a API retornar seus dados completos.",
        "<code>GET /pokeapi/pikachu</code>, que o Flutter acessa diretamente na PokéAPI sem passar pelo backend Flask do projeto.",
        "<code>GET /nome?pokemon=pikachu</code>, informando o nome como parâmetro de query string em vez de fazer parte do caminho da URL."
      ], correta: 0, explicacao: "A rota é <code>GET /pokemons/nome/&lt;nome&gt;</code>. O Flask consulta a PokéAPI e devolve id, nome, imagem, tipo, altura e peso." },
    { tema: "Fluxo · regra", pergunta: "Na atividade da Pokédex, o Flutter pode acessar a PokéAPI diretamente?",
      opcoes: [
        "Não. O fluxo deve ser Flutter → Provider → Service → Flask → PokéAPI; o Flutter nunca acessa a PokéAPI diretamente.",
        "Sim, desde que a requisição seja feita dentro da tela inicial para agilizar o carregamento dos dados dos Pokémon.",
        "Sim, o Flutter deve acessar a PokéAPI diretamente e usar o Flask apenas para salvar os Pokémon favoritos do usuário.",
        "Não, mas apenas em Flutter Web; no aplicativo mobile o acesso direto à PokéAPI é permitido e recomendado pela atividade."
      ], correta: 0, explicacao: "Regra importante: o Flutter não acessa a PokéAPI direto. Todo o HTTP passa pela Service, que fala com o Flask, que fala com a PokéAPI." },
    { tema: "SQLite · Model", pergunta: "Na atividade \"Minha Lista de Filmes\", quais campos a classe <code>Filme</code> deve possuir?",
      opcoes: [
        "<code>id</code>, <code>titulo</code> e <code>assistido</code>, sendo o id criado pelo SQLite e o assistido um valor true ou false.",
        "<code>nome</code>, <code>ano</code> e <code>nota</code>, todos obrigatórios e digitados manualmente pelo usuário no momento do cadastro.",
        "<code>id</code>, <code>categoria</code> e <code>preco</code>, seguindo a mesma estrutura usada na tabela de produtos do controle de estoque.",
        "Apenas <code>titulo</code>, já que o SQLite não permite armazenar valores booleanos como o status de assistido de um filme."
      ], correta: 0, explicacao: "O Model <code>Filme</code> tem <code>id</code> (gerado pelo SQLite), <code>titulo</code> (nome do filme) e <code>assistido</code> (true/false)." },
    { tema: "SQLite · booleano", pergunta: "No SQLite, como o valor booleano <code>assistido</code> costuma ser armazenado?",
      opcoes: [
        "Como um número inteiro (INTEGER): <code>0</code> para false e <code>1</code> para true, pois o SQLite não tem um tipo booleano próprio.",
        "Como um texto (TEXT) contendo literalmente as palavras \"true\" e \"false\", que são convertidas em booleano na hora de exibir.",
        "Como um tipo BOOLEAN nativo do SQLite, que aceita diretamente os valores <code>true</code> e <code>false</code> sem conversão.",
        "Como um valor REAL, usando <code>0.0</code> para false e <code>1.0</code> para true por questões de compatibilidade entre bancos."
      ], correta: 0, explicacao: "O SQLite guarda o booleano como INTEGER: false → 0, true → 1. A coluna <code>assistido</code> é <code>INTEGER NOT NULL</code>." },
    { tema: "SQLite · CRUD", pergunta: "Qual comando SQL é usado para <b>cadastrar</b> um novo registro (ex.: um novo filme ou produto)?",
      opcoes: [
        "<code>INSERT</code>, usado para inserir uma nova linha na tabela do banco de dados.",
        "<code>SELECT</code>, usado para adicionar um registro ao mesmo tempo em que consulta os dados já existentes na tabela.",
        "<code>UPDATE</code>, que cria o registro caso ele ainda não exista e atualiza seus dados caso já esteja cadastrado.",
        "<code>CREATE</code>, comando responsável por inserir cada novo item dentro de uma tabela já criada anteriormente no banco."
      ], correta: 0, explicacao: "INSERT = cadastrar. SELECT = buscar, UPDATE = alterar, DELETE = excluir. São as quatro operações do CRUD." },
    { tema: "SQLite · CRUD", pergunta: "Qual comando SQL é usado para <b>buscar</b> registros já salvos no banco?",
      opcoes: [
        "<code>SELECT</code>, que consulta e retorna os registros da tabela conforme os critérios informados.",
        "<code>GET</code>, comando padrão do SQLite para recuperar todas as linhas de uma determinada tabela do banco de dados.",
        "<code>FIND</code>, usado especificamente para localizar um único registro a partir do seu id dentro da tabela consultada.",
        "<code>READ</code>, que faz parte do CRUD e é o comando responsável por ler os dados persistidos em qualquer tabela SQLite."
      ], correta: 0, explicacao: "SELECT = buscar/ler registros. No CRUD, o \"R\" (Read) corresponde ao comando SELECT do SQL." },
    { tema: "Firebase", pergunta: "Na atividade \"Central de Missões\", qual serviço do Firebase é usado para armazenar as missões?",
      opcoes: [
        "O Cloud Firestore, um banco de dados de documentos onde as missões ficam em uma collection chamada <code>missoes</code>.",
        "O Firebase Authentication, responsável por guardar cada missão vinculada ao login do usuário que a cadastrou no app.",
        "O Firebase Storage, usado para salvar as missões em arquivos separados e recuperá-los quando o aplicativo for aberto.",
        "O Realtime Database local, que mantém as missões apenas no dispositivo e nunca as sincroniza com a nuvem do projeto."
      ], correta: 0, explicacao: "É o Cloud Firestore, banco de documentos. As missões ficam numa collection <code>missoes</code>, cada uma como um documento." },
    { tema: "Firebase · estrutura", pergunta: "No Cloud Firestore, como os dados são organizados?",
      opcoes: [
        "Em collections que contêm documents, e cada document guarda campos (ex.: titulo, dificuldade, pontos, concluida).",
        "Em tabelas com linhas e colunas fixas, exatamente como em um banco de dados relacional tradicional como o SQLite.",
        "Em arquivos de texto separados por vírgula, um para cada registro, agrupados dentro de pastas no servidor do Firebase.",
        "Em uma única lista global na memória do aplicativo, que é enviada inteira para a nuvem sempre que algo é alterado."
      ], correta: 0, explicacao: "Firestore = collections → documents → campos. Na Central de Missões, a collection <code>missoes</code> tem um documento por missão." },
    { tema: "Estoque · login", pergunta: "Na atividade de Controle de Estoque, o que acontece quando o login está correto?",
      opcoes: [
        "O usuário acessa a tela principal, que exibe uma saudação com o nome encontrado no SQLite (ex.: \"Olá, Lucas!\").",
        "O aplicativo cadastra automaticamente um novo usuário no banco e depois libera o acesso à tela de controle de estoque.",
        "O sistema mostra a mensagem \"E-mail ou senha incorretos\" e permanece na tela de login aguardando uma nova tentativa.",

    { tema: "Firestore · update", trecho: `<span class="kw">await</span> FirebaseFirestore.instance\n  .collection(<span class="str">"missoes"</span>)\n  .doc(id)\n  .update({<span class="str">"concluida"</span>: <span class="kw">true</span>});`,
      pergunta: "O que este código faz?",
      opcoes: [
        "Marca uma missão como concluída no Firestore, alterando o campo <code>concluida</code> para true no documento com aquele id.",
        "Adiciona uma nova missão concluída à collection, criando um documento com o campo <code>concluida</code> igual a true.",
        "Exclui do Firestore a missão cujo id foi informado, removendo permanentemente o documento da collection missoes.",
        "Busca uma missão específica pelo id e retorna se ela já está concluída, sem alterar nenhum dado no banco da nuvem."
      ], correta: 0, explicacao: "<code>.doc(id).update({\"concluida\": true})</code> altera só aquele documento no Firestore — é como se conclui uma missão na nuvem." },
    { tema: "Model · fromMap", trecho: `factory <span class="fn">Filme</span>.fromMap(Map m) {\n  <span class="kw">return</span> <span class="fn">Filme</span>(\n    id: m[<span class="str">"id"</span>],\n    titulo: m[<span class="str">"titulo"</span>],\n    assistido: m[<span class="str">"assistido"</span>] == <span class="num">1</span>,\n  );\n}`,
      pergunta: "O que este construtor faz com o campo <code>assistido</code>?",
      opcoes: [
        "Converte o inteiro do banco de volta em booleano: <code>== 1</code> vira true, qualquer outro valor (0) vira false.",
        "Converte o texto \"assistido\" em um número inteiro para poder ser salvo corretamente na tabela do SQLite.",
        "Marca todo filme lido do banco como assistido, já que a comparação <code>== 1</code> é sempre verdadeira no Dart.",
        "Ignora o campo assistido ao ler do banco, deixando-o sempre com o valor padrão definido no construtor da classe."
      ], correta: 0, explicacao: "<code>fromMap</code> reconstrói o objeto a partir da linha do banco. <code>m[\"assistido\"] == 1</code> converte o INTEGER de volta em booleano." },
    { tema: "Estoque · print", trecho: `<span class="kw">await</span> db.insert(<span class="str">"usuarios"</span>, dados);\n<span class="fn">print</span>(<span class="str">"INSERT → Usuário cadastrado: "</span> + nome);`,
      pergunta: "Qual é o objetivo do <code>print</code> logo após o <code>insert</code>?",
      opcoes: [
        "Confirmar no terminal que o cadastro chegou ao banco, ajudando a depurar e verificar se o INSERT funcionou.",
        "Enviar a mensagem de cadastro para a tela do usuário, exibindo uma confirmação visual de que a conta foi criada.",
        "Fazer o SQLite efetivar a gravação, pois sem o <code>print</code> o INSERT anterior não é confirmado no banco de dados.",
        "Cadastrar um segundo usuário automaticamente com o mesmo nome, usado apenas em ambiente de testes do aplicativo."
      ], correta: 0, explicacao: "O <code>print</code> mostra no terminal que o INSERT aconteceu — é depuração/confirmação, como pede a atividade de estoque." },
    { tema: "Provider · carregar", trecho: `<span class="fn">void</span> <span class="fn">carregarVoos</span>(String aeroporto) <span class="kw">async</span> {\n  carregando = <span class="kw">true</span>;\n  <span class="fn">notifyListeners</span>();\n  voos = <span class="kw">await</span> service.buscarVoos(aeroporto);\n  carregando = <span class="kw">false</span>;\n  <span class="fn">notifyListeners</span>();\n}`,
      pergunta: "Por que há dois <code>notifyListeners()</code> neste método?",
      opcoes: [
        "O primeiro mostra o carregamento na tela; o segundo, após os dados chegarem, esconde o loading e exibe os voos.",
        "É um erro de código: chamar <code>notifyListeners()</code> duas vezes trava a tela e deve ser evitado nos Providers.",
        "O primeiro salva os voos no SQLite e o segundo os envia para o Firestore, sincronizando os dois bancos de dados.",
        "Os dois são idênticos e um deles é opcional; o método funcionaria exatamente igual com apenas um deles presente."
      ], correta: 0, explicacao: "Primeiro notify: <code>carregando = true</code> → tela mostra o spinner. Segundo: dados chegaram e <code>carregando = false</code> → tela mostra os voos." },
    { tema: "Firestore · delete", trecho: `<span class="kw">await</span> FirebaseFirestore.instance\n  .collection(<span class="str">"missoes"</span>)\n  .doc(id)\n  .delete();`,
      pergunta: "O que este código faz?",
      opcoes: [
        "Exclui do Firestore o documento (missão) cujo id foi informado, removendo-o permanentemente da collection.",
        "Marca a missão como concluída, alterando o campo <code>concluida</code> para true no documento correspondente.",
        "Busca a missão pelo id e a devolve como objeto <code>Missao</code>, sem remover nada do banco de dados na nuvem.",
        "Remove apenas o campo <code>concluida</code> do documento, mantendo o restante dos dados da missão intactos."
      ], correta: 0, explicacao: "<code>.doc(id).delete()</code> apaga aquele documento do Firestore. Se a missão era concluída, seus pontos também somem do total." }
  ];

  /* =========================== MODO RESUMO (11) =========================== */
  const resumo = [
    { titulo: "Arquitetura em camadas", tag: "o mapa de tudo", corpo: `<p>Todas as atividades seguem a mesma ideia: separar responsabilidades em camadas.</p>
<span class="destaque">TELA MOSTRA.<br>PROVIDER CONTROLA.<br>SERVICE SE COMUNICA.<br>FLASK / BANCO RESPONDE.</span>
<p><b>Page</b> → só exibe os dados. <b>Provider</b> → guarda o estado, controla loading/erro, avisa as telas. <b>Service</b> → faz o HTTP ou acessa o banco. <b>Backend/Banco</b> → responde com os dados.</p>
<p>Regra de ouro: a tela <b>nunca</b> faz <code>http.get</code> nem acessa o banco direto. Tudo passa pelas camadas.</p>` },
    { titulo: "Provider & ChangeNotifier", tag: "controle de estado", corpo: `<p>O Provider é uma classe que <code>extends ChangeNotifier</code>. Ele guarda os dados e avisa as telas quando algo muda.</p>
<span class="destaque">class VooProvider extends ChangeNotifier {<br>&nbsp;&nbsp;List&lt;Voo&gt; voos = [];<br>&nbsp;&nbsp;bool carregando = false;<br><br>&nbsp;&nbsp;void setVoos(lista) {<br>&nbsp;&nbsp;&nbsp;&nbsp;voos = lista;<br>&nbsp;&nbsp;&nbsp;&nbsp;notifyListeners();<br>&nbsp;&nbsp;}<br>}</span>
<p><b>notifyListeners()</b> é o que redesenha as telas ouvintes. Esqueceu de chamar? Os dados mudam mas a tela congela no valor antigo.</p>` },
    { titulo: "Service — comunicação", tag: "HTTP e banco", corpo: `<p>A Service é a única camada que fala com o mundo externo: faz o <b>HTTP</b> (API) ou acessa o <b>banco</b> (SQLite/Firebase).</p>
<span class="destaque">Future&lt;List&lt;Voo&gt;&gt; buscarVoos(aeroporto) async {<br>&nbsp;&nbsp;final r = await http.get(url);<br>&nbsp;&nbsp;final dados = jsonDecode(r.body);<br>&nbsp;&nbsp;return dados.map((v) => Voo.fromJson(v)).toList();<br>}</span>
<p>As chamadas HTTP ficam sempre em <code>services/</code> — nunca dentro da tela. Métodos de rede/banco são <code>async</code> e retornam <code>Future</code>.</p>` },
    { titulo: "Integração Flutter + Flask", tag: "PokéAPI e voos", corpo: `<p>O Flutter <b>nunca</b> acessa a API externa direto. O fluxo é sempre:</p>
<span class="destaque">Flutter → Provider → Service → Flask → API externa</span>
<p>O Flask cria rotas que consultam a API e devolvem um JSON próprio. Ex. da Pokédex: <code>GET /pokemons/nome/&lt;nome&gt;</code>.</p>
<p>Na atividade de voos, o Flask roda em <code>127.0.0.1:5001</code> e a rota é <code>/api/voos?aeroporto=SBGR&tipo=chegadas</code>. Precisa de <b>dois terminais</b>: um pro Python, um pro Flutter.</p>` },
    { titulo: "SQLite — persistência local", tag: "dados que ficam salvos", corpo: `<p>Uma <code>List</code> some quando o app fecha. O <b>SQLite</b> salva os dados no dispositivo — eles sobrevivem ao reinício.</p>
<span class="destaque">id → INTEGER PRIMARY KEY AUTOINCREMENT<br>titulo → TEXT NOT NULL<br>assistido → INTEGER NOT NULL</span>
<p>O SQLite não tem booleano: <b>false = 0, true = 1</b>. Converte na ida (<code>? 1 : 0</code>) e na volta (<code>== 1</code>).</p>` },
    { titulo: "CRUD no SQLite", tag: "as 4 operações", corpo: `<p>Toda manipulação do banco cai em uma das quatro operações:</p>
<span class="destaque">INSERT → cadastrar (db.insert)<br>SELECT → buscar (db.query)<br>UPDATE → alterar (db.update)<br>DELETE → excluir (db.delete)</span>
<p>No estoque: cadastrar usuário/produto = INSERT, login = SELECT, mudar quantidade = UPDATE, excluir = DELETE. E lembre: alterar só na tela não persiste — tem que gravar no banco.</p>` },
    { titulo: "Login & validação", tag: "controle de estoque", corpo: `<p>O login consulta o banco: se existir um usuário com aquele e-mail <b>e</b> senha, libera o acesso.</p>
<span class="destaque">Usuário digita → Provider → Service → SQLite<br>→ SELECT (email = ? AND senha = ?)<br>→ encontrou? entra : "E-mail ou senha incorretos"</span>
<p>Para não repetir e-mail: antes do INSERT, faça um SELECT. Se o e-mail já existe → "E-mail já cadastrado".</p>` },
    { titulo: "MVVM — Lista de Filmes", tag: "Model-View-ViewModel", corpo: `<p>Variação da arquitetura: a <b>ViewModel</b> faz o papel do Provider.</p>
<p><b>Model</b> (<code>Filme</code>: id, titulo, assistido) → <b>View</b> (a tela) → <b>ViewModel</b> (guarda a List, avisa a View) → <b>Service</b> (SQLite).</p>
<span class="destaque">A List&lt;Filme&gt; da ViewModel NÃO persiste.<br>Quem salva é o FilmeService (SQLite).</span>
<p>A ViewModel carrega, adiciona e altera status, sempre chamando <code>notifyListeners()</code> para atualizar a tela.</p>` },
    { titulo: "Firebase Cloud Firestore", tag: "banco na nuvem", corpo: `<p>O Firestore é um banco de <b>documentos</b> na nuvem. Estrutura: collection → documents → campos.</p>
<span class="destaque">missoes (collection)<br>&nbsp;└ documento1<br>&nbsp;&nbsp;&nbsp;├ titulo: "Estudar Firebase"<br>&nbsp;&nbsp;&nbsp;├ dificuldade: "Difícil"<br>&nbsp;&nbsp;&nbsp;├ pontos: 30<br>&nbsp;&nbsp;&nbsp;└ concluida: false</span>
<p>Diferente do SQLite (local), o Firestore é remoto e sincronizado. Toda alteração no app deve refletir na nuvem.</p>` },
    { titulo: "CRUD no Firestore", tag: "métodos do Firebase", corpo: `<p>As operações da Service usam os métodos do Firestore:</p>
<span class="destaque">.add() → adicionar documento<br>.get() → buscar todos<br>.update() → atualizar campo<br>.delete() → excluir documento</span>
<p>Concluir missão = <code>.doc(id).update({"concluida": true})</code>. Excluir = <code>.doc(id).delete()</code>. Os pontos só contam para missões com <code>concluida: true</code>.</p>` },
    { titulo: "Model: toMap & fromMap", tag: "converter dados", corpo: `<p>Para salvar objetos Dart no Firebase (ou SQLite), converte-se entre objeto e Map.</p>
<span class="destaque">toMap() → objeto Dart vira Map (para salvar)<br>fromMap() → Map vira objeto Dart (ao ler)</span>
<p>No Firestore o <code>id</code> costuma ser <code>String? id</code> (nullable), porque a missão só ganha id depois que o documento é criado. Ao ler, guarda-se o id com <code>d.id</code>.</p>` }
  ];

  const modos = {
    facil:   { nome: "Fácil",   tipo: "quiz",   questoes: facil },
    medio:   { nome: "Médio",   tipo: "quiz",   questoes: medio },
    dificil: { nome: "Difícil", tipo: "quiz",   questoes: dificil },
    codigo:  { nome: "Código",  tipo: "quiz",   questoes: codigo },
    resumo:  { nome: "Resumo",  tipo: "resumo", questoes: resumo }
  };

  const temasChips = ["Arquitetura", "Provider", "Service", "Flask + API", "SQLite", "CRUD", "Firebase", "MVVM"];

  let modoAtual = null, questoes = [], atual = 0, acertos = 0, ordemAtual = [], respondida = false, erros = [], iniciado = false, respostasDadas = [];

  const navbar = document.getElementById("navbar");
  const card = document.getElementById("card");
  const barra = document.getElementById("barra");
  const contador = document.getElementById("contador");
  const placar = document.getElementById("placar");

  function embaralhar(n) {
    const arr = [...Array(n).keys()];
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }

  function renderNavbar() {
    if (!iniciado) { navbar.innerHTML = ""; return; }
    const ehResumo = modos[modoAtual].tipo === "resumo";
    const podeVoltar = atual > 0;
    navbar.innerHTML = `
      <button class="nav-btn home" onclick="telaInicial()">⌂ Início</button>
      <button class="nav-btn" onclick="voltarQuestao()" ${podeVoltar ? "" : "disabled"}>← ${ehResumo ? "Anterior" : "Questão anterior"}</button>
      <span class="nav-spacer"></span>
      <span class="nav-modo">modo: <b>${modos[modoAtual].nome}</b></span>`;
  }

  function telaInicial() {
    iniciado = false; modoAtual = null; renderNavbar();
    barra.style.width = "0%"; contador.textContent = ""; placar.textContent = "";
    card.innerHTML = `
      <div class="hero">
        <h1>&gt; Prova Flutter<br><span>Integração & Persistência</span></h1>
        <p class="desc">API + Flask (PokéAPI, voos), SQLite (filmes, estoque com login) e Firebase Firestore (missões). Nos quizzes as alternativas embaralham e a explicação aparece na hora. O modo Resumo é material de estudo.</p>
        <div class="chips">${temasChips.map(t => `<span class="chip">${t}</span>`).join("")}</div>
        <div class="modos">
          <button class="modo facil" onclick="iniciar('facil')"><span class="m-icone">🟢</span><span class="m-nome">Fácil</span><span class="m-desc">18 questões · conceitos e definições básicas</span></button>
          <button class="modo medio" onclick="iniciar('medio')"><span class="m-icone">🟡</span><span class="m-nome">Médio</span><span class="m-desc">18 questões · aplicação prática dos conceitos</span></button>
          <button class="modo dificil" onclick="iniciar('dificil')"><span class="m-icone">🔴</span><span class="m-nome">Difícil</span><span class="m-desc">20 questões · justificativas técnicas e pegadinhas</span></button>
          <button class="modo codigo" onclick="iniciar('codigo')"><span class="m-icone">💻</span><span class="m-nome">Código</span><span class="m-desc">16 trechos · leia o código e acerte o que ele faz</span></button>
          <button class="modo resumo" onclick="iniciar('resumo')"><span class="m-icone">📖</span><span class="m-nome">Resumo</span><span class="m-desc">11 tópicos · material de estudo, sem quiz</span></button>
        </div>
        <p class="dica-teclado">atalhos nos quizzes: 1–4 responde · Enter avança · ← volta</p>
      </div>`;
  }

  function iniciar(modo) {
    modoAtual = modo; questoes = modos[modo].questoes; iniciado = true;
    atual = 0; acertos = 0; erros = [];
    respostasDadas = new Array(questoes.length).fill(null);
    if (modos[modo].tipo === "resumo") mostrarResumo(); else mostrarQuestao();
  }

  function voltarQuestao() {
    if (atual === 0) return;
    atual--;
    if (modos[modoAtual].tipo === "resumo") { mostrarResumo(); return; }
    if (respostasDadas[atual] !== null) {
      const q = questoes[atual];
      if (respostasDadas[atual] === q.correta) acertos = Math.max(0, acertos - 1);
      erros = erros.filter(e => e !== q);
      respostasDadas[atual] = null;
    }
    mostrarQuestao();
  }

  function mostrarQuestao() {
    const q = questoes[atual];
    respondida = false;
    ordemAtual = embaralhar(q.opcoes.length);
    renderNavbar();
    barra.style.width = `${(atual / questoes.length) * 100}%`;
    contador.textContent = `[${modos[modoAtual].nome.toLowerCase()}] questão ${String(atual + 1).padStart(2, "0")} / ${questoes.length}`;
    placar.textContent = `${acertos} acerto${acertos === 1 ? "" : "s"}`;
    const bloco = q.trecho ? `<pre>${q.trecho}</pre>` : "";
    card.innerHTML = `
      <span class="tema">◆ ${q.tema}</span>
      ${bloco}
      <div class="pergunta">${q.pergunta}</div>
      ${ordemAtual.map((idxOriginal, pos) => `
        <button class="opcao" data-pos="${pos}" onclick="responder(${idxOriginal})">
          <span class="letra">${String.fromCharCode(65 + pos)}</span>
          <span class="txt">${q.opcoes[idxOriginal]}</span>
        </button>`).join("")}
      <div class="explicacao" id="explicacao"></div>
      <button class="botao" id="proxima" onclick="proxima()">Próxima →</button>`;
  }

  function responder(idxOriginal) {
    if (respondida) return;
    respondida = true;
    const q = questoes[atual];
    respostasDadas[atual] = idxOriginal;
    const botoes = card.querySelectorAll(".opcao");
    botoes.forEach(b => b.disabled = true);
    const posCorreta = ordemAtual.indexOf(q.correta);
    const posClicada = ordemAtual.indexOf(idxOriginal);
    const acertou = idxOriginal === q.correta;
    botoes[posCorreta].classList.add("correta");
    botoes.forEach((b, i) => { if (i !== posCorreta && i !== posClicada) b.classList.add("apagada"); });
    const exp = document.getElementById("explicacao");
    if (acertou) { acertos++; exp.innerHTML = `<span class="tag">✓ ACERTOU</span>${q.explicacao}`; }
    else { botoes[posClicada].classList.add("errada"); exp.classList.add("err"); exp.innerHTML = `<span class="tag">✗ ERROU</span>${q.explicacao}`; erros.push(q); }
    exp.style.display = "block";
    const btn = document.getElementById("proxima");
    if (atual === questoes.length - 1) btn.textContent = "Ver resultado →";
    btn.classList.add("mostrar");
    placar.textContent = `${acertos} acerto${acertos === 1 ? "" : "s"}`;
  }

  function proxima() {
    atual++;
    if (atual < questoes.length) mostrarQuestao(); else mostrarResultado();
  }

  function mostrarResultado() {
    renderNavbar();
    barra.style.width = "100%";
    contador.textContent = `[${modos[modoAtual].nome.toLowerCase()}] resultado`;
    placar.textContent = "";
    const pct = Math.round((acertos / questoes.length) * 100);
    let veredito, sub;
    if (pct >= 90)      { veredito = "Monstro. 🏆";                sub = modoAtual === "dificil" ? "Pode fazer a prova de olhos fechados." : "Bora subir de nível — tenta o próximo modo."; }
    else if (pct >= 70) { veredito = "Tá pronto pra prova. 🚀";    sub = "Só dá uma olhada nos erros abaixo."; }
    else if (pct >= 50) { veredito = "Na média, mas dá pra mais."; sub = "Revisa os tópicos das questões erradas."; }
    else                { veredito = "Volta pra teoria. 📚";       sub = "Dá uma passada no modo Resumo e refaz."; }
    card.innerHTML = `
      <div class="resultado">
        <div class="anel" style="--pct: ${pct}"><span class="num">${acertos}/${questoes.length}</span><span class="sub">${pct}%</span></div>
        <p class="veredito">${veredito}</p>
        <p class="veredito-sub">${sub}</p>
        <button class="botao mostrar" onclick="iniciar(modoAtual)">Refazer ↻</button>
        <button class="botao secundario mostrar" onclick="telaInicial()">Trocar modo</button>
      </div>
      ${erros.length ? `
        <div class="revisao">
          <h3>Pra revisar (${erros.length})</h3>
          ${erros.map(q => `
            <div class="rev-item">
              <div class="q">◆ [${q.tema}] ${q.pergunta.split("<pre>")[0]}</div>
              <div class="r"><b>Resposta:</b> ${q.opcoes[q.correta]}</div>
            </div>`).join("")}
        </div>` : ""}`;
  }

  function mostrarResumo() {
    const r = resumo[atual];
    renderNavbar();
    barra.style.width = `${((atual + 1) / resumo.length) * 100}%`;
    contador.textContent = `[resumo] tópico ${String(atual + 1).padStart(2, "0")} / ${resumo.length}`;
    placar.textContent = "";
    const ehUltimo = atual === resumo.length - 1;
    card.innerHTML = `
      <div class="resumo-topo"><h2>${r.titulo}</h2><span class="resumo-tag">${r.tag}</span></div>
      <div class="resumo-corpo">${r.corpo}</div>
      <div class="resumo-lista">
        ${resumo.map((t, i) => `<button class="resumo-nav ${i === atual ? "ativo" : ""}" onclick="irResumo(${i})">${i + 1}. ${t.titulo}</button>`).join("")}
      </div>
      <button class="botao mostrar" onclick="${ehUltimo ? "telaInicial()" : "proximoResumo()"}">${ehUltimo ? "Concluir ✓" : "Próximo tópico →"}</button>`;
  }

  function proximoResumo() { if (atual < resumo.length - 1) { atual++; mostrarResumo(); } }
  function irResumo(i) { atual = i; mostrarResumo(); }

  document.addEventListener("keydown", (e) => {
    if (!iniciado) {
      const map = { "1": "facil", "2": "medio", "3": "dificil", "4": "codigo", "5": "resumo" };
      if (map[e.key]) iniciar(map[e.key]);
      return;
    }
    const tipo = modos[modoAtual].tipo;
    if (tipo === "resumo") {
      if (e.key === "ArrowRight") proximoResumo();
      else if (e.key === "ArrowLeft") voltarQuestao();
      return;
    }
    if (!respondida && ["1","2","3","4"].includes(e.key)) {
      const pos = parseInt(e.key) - 1;
      if (pos < ordemAtual.length) responder(ordemAtual[pos]);
    } else if (respondida && e.key === "Enter") { proxima(); }
    else if (e.key === "ArrowLeft") { voltarQuestao(); }
  });

  telaInicial();
</script>
</body>
</html>
