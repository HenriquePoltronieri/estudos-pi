<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Python & Pandas — Análise de Dados</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #060a12; --card: #0f1826; --card2: #16202f; --border: #263447;
    --texto: #e4e9f0; --dim: #8494a8; --azulesc: #7db9ff;
    --verde: #4ade80; --verde-soft: rgba(74, 222, 128, 0.1);
    --vermelho: #f87171; --vermelho-soft: rgba(248, 113, 113, 0.1);
    --dourado: #e8c14f; --dourado-soft: rgba(232, 193, 79, 0.12);
    --codigo: #ff9db8; --roxo: #a78bfa;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    background-image: radial-gradient(circle at 50% -20%, rgba(125, 185, 255, 0.06), transparent 60%);
    color: var(--texto); font-family: 'JetBrains Mono', monospace;
    min-height: 100vh; display: flex; justify-content: center; padding: 32px 16px;
  }
  .app { width: 100%; max-width: 760px; }
  .topbar { height: 6px; background: linear-gradient(90deg, #1a3a5c 0%, #1a3a5c 55%, var(--dourado) 100%); border-radius: 99px; margin-bottom: 18px; }
  .navbar { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; min-height: 36px; }
  .nav-btn { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--border); color: var(--dim); font-family: inherit; font-size: 0.72rem; font-weight: 600; padding: 8px 13px; border-radius: 8px; cursor: pointer; transition: color 0.15s, border-color 0.15s, transform 0.1s; }
  .nav-btn:hover:not(:disabled) { color: var(--texto); border-color: var(--dim); transform: translateY(-1px); }
  .nav-btn:disabled { opacity: 0.4; cursor: default; }
  .nav-btn.home:hover:not(:disabled) { color: var(--azulesc); border-color: var(--azulesc); }
  .nav-spacer { flex: 1; }
  .nav-modo { font-size: 0.7rem; color: var(--dim); background: var(--card); border: 1px solid var(--border); padding: 6px 12px; border-radius: 99px; }
  .nav-modo b { color: var(--texto); }
  .barra-wrap { height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; margin-bottom: 20px; }
  .barra { height: 100%; width: 0%; background: linear-gradient(90deg, var(--dourado), #f5d97e); border-radius: 99px; transition: width 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
  .topo { display: flex; justify-content: space-between; align-items: center; font-size: 0.75rem; color: var(--dim); margin-bottom: 10px; }
  .topo .placar { color: var(--verde); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 28px; box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3); animation: entrar 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes entrar { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  .hero h1 { font-size: 1.5rem; font-weight: 800; line-height: 1.3; color: var(--texto); }
  .hero h1 span { color: var(--dourado); }
  .hero .desc { color: var(--dim); font-size: 0.85rem; margin: 14px 0 20px; line-height: 1.6; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
  .chip { font-size: 0.7rem; color: var(--dim); background: var(--card2); border: 1px solid var(--border); padding: 5px 10px; border-radius: 99px; }
  .modos { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 8px; }
  @media (max-width: 560px) { .modos { grid-template-columns: 1fr; } }
  .modo { background: var(--card2); border: 1px solid var(--border); border-radius: 12px; padding: 16px 14px; cursor: pointer; font-family: inherit; color: var(--texto); text-align: left; transition: border-color 0.15s, transform 0.1s; }
  .modo:hover { transform: translateY(-2px); }
  .modo .m-icone { font-size: 1.2rem; display: block; margin-bottom: 8px; }
  .modo .m-nome { font-weight: 800; font-size: 0.88rem; display: block; margin-bottom: 4px; }
  .modo .m-desc { font-size: 0.67rem; color: var(--dim); line-height: 1.5; display: block; }
  .modo.facil:hover { border-color: var(--verde); } .modo.facil .m-nome { color: var(--verde); }
  .modo.medio:hover { border-color: var(--dourado); } .modo.medio .m-nome { color: var(--dourado); }
  .modo.dificil:hover { border-color: var(--vermelho); } .modo.dificil .m-nome { color: var(--vermelho); }
  .modo.codigo:hover { border-color: var(--azulesc); } .modo.codigo .m-nome { color: var(--azulesc); }
  .modo.resumo:hover { border-color: var(--roxo); } .modo.resumo .m-nome { color: var(--roxo); }
  .tema { display: inline-flex; align-items: center; gap: 6px; font-size: 0.7rem; font-weight: 600; color: var(--dourado); background: var(--dourado-soft); border: 1px solid rgba(232, 193, 79, 0.3); padding: 4px 12px; border-radius: 99px; margin-bottom: 16px; }
  .pergunta { font-size: 0.95rem; line-height: 1.65; margin-bottom: 22px; }
  .pergunta b { color: var(--dourado); }
  code { background: var(--card2); padding: 2px 6px; border-radius: 5px; color: var(--codigo); font-size: 0.85em; font-family: inherit; }
  pre { background: #05090f; border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 14px 0 20px; overflow-x: auto; font-size: 0.8rem; line-height: 1.65; color: #e8eef5; }
  pre .kw { color: #ff9db8; } pre .fn { color: #7db9ff; } pre .str { color: #a5e8b0; } pre .cm { color: #6b7d94; font-style: italic; } pre .num { color: #f5c563; }
  .opcao { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: left; background: var(--card2); border: 1px solid var(--border); color: var(--texto); font-family: inherit; font-size: 0.83rem; line-height: 1.55; padding: 13px 15px; border-radius: 10px; margin-bottom: 9px; cursor: pointer; transition: border-color 0.15s, transform 0.1s, background 0.15s; }
  .opcao .txt { display: block; min-height: 3.1em; }
  .opcao:hover:not(:disabled) { border-color: var(--verde); transform: translateX(3px); }
  .opcao:disabled { cursor: default; }
  .letra { flex-shrink: 0; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; font-weight: 800; color: var(--dim); background: var(--bg); border: 1px solid var(--border); border-radius: 6px; margin-top: 1px; transition: all 0.15s; }
  .opcao:hover:not(:disabled) .letra { color: var(--verde); border-color: var(--verde); }
  .opcao.correta { border-color: var(--verde); background: var(--verde-soft); }
  .opcao.correta .letra { background: var(--verde); border-color: var(--verde); color: #052e16; }
  .opcao.errada { border-color: var(--vermelho); background: var(--vermelho-soft); }
  .opcao.errada .letra { background: var(--vermelho); border-color: var(--vermelho); color: #450a0a; }
  .opcao.apagada { opacity: 0.45; }
  .explicacao { display: none; margin-top: 18px; padding: 14px 16px; background: var(--card2); border: 1px solid var(--border); border-left: 3px solid var(--verde); border-radius: 8px; font-size: 0.82rem; line-height: 1.6; color: var(--dim); animation: entrar 0.3s ease; }
  .explicacao .tag { color: var(--verde); font-weight: 800; margin-right: 6px; }
  .explicacao.err .tag { color: var(--vermelho); } .explicacao.err { border-left-color: var(--vermelho); }
  .botao { display: none; margin-top: 20px; background: var(--dourado); color: #1a1400; border: none; font-family: inherit; font-weight: 800; font-size: 0.85rem; padding: 13px 28px; border-radius: 10px; cursor: pointer; transition: transform 0.1s, filter 0.15s; }
  .botao:hover { filter: brightness(1.15); transform: translateY(-1px); }
  .botao.mostrar { display: inline-block; animation: entrar 0.3s ease; }
  .botao.secundario { background: transparent; color: var(--dim); border: 1px solid var(--border); margin-left: 8px; }
  .botao.secundario:hover { color: var(--texto); border-color: var(--dim); }
  .dica-teclado { font-size: 0.68rem; color: #4a5568; margin-top: 14px; }
  .resultado { text-align: center; }
  .anel { width: 140px; height: 140px; margin: 10px auto 18px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(closest-side, var(--card) 82%, transparent 83%), conic-gradient(var(--verde) calc(var(--pct) * 1%), var(--border) 0); }
  .anel .num { font-size: 1.8rem; font-weight: 800; color: var(--verde); }
  .anel .sub { font-size: 0.7rem; color: var(--dim); }
  .veredito { color: var(--texto); font-size: 0.95rem; margin-bottom: 4px; font-weight: 600; }
  .veredito-sub { color: var(--dim); font-size: 0.8rem; margin-bottom: 24px; }
  .revisao { text-align: left; margin-top: 8px; }
  .revisao h3 { font-size: 0.8rem; color: var(--vermelho); margin-bottom: 12px; text-transform: uppercase; letter-spacing: 0.08em; }
  .rev-item { background: var(--card2); border: 1px solid var(--border); border-left: 3px solid var(--vermelho); border-radius: 8px; padding: 13px 15px; margin-bottom: 9px; font-size: 0.78rem; line-height: 1.6; }
  .rev-item .q { color: var(--texto); margin-bottom: 6px; }
  .rev-item .r { color: var(--dim); } .rev-item .r b { color: var(--verde); font-weight: 600; }
  .resumo-topo { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; flex-wrap: wrap; }
  .resumo-topo h2 { font-size: 1.15rem; font-weight: 800; color: var(--roxo); }
  .resumo-tag { font-size: 0.7rem; color: var(--dim); background: var(--card2); border: 1px solid var(--border); padding: 3px 10px; border-radius: 99px; }
  .resumo-corpo { font-size: 0.88rem; line-height: 1.75; color: var(--texto); }
  .resumo-corpo p { margin-bottom: 14px; } .resumo-corpo b { color: var(--dourado); }
  .resumo-corpo .destaque { display: block; background: #05090f; border: 1px solid var(--border); border-radius: 6px; padding: 12px 14px; margin: 4px 0 16px; font-size: 0.82rem; color: #cdd7e3; line-height: 1.7; }
  .resumo-corpo .destaque code { background: rgba(255,255,255,0.08); color: #ff9db8; }
  .resumo-lista { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .resumo-nav { font-size: 0.72rem; color: var(--dim); background: var(--card2); border: 1px solid var(--border); padding: 7px 12px; border-radius: 8px; cursor: pointer; font-family: inherit; transition: all 0.15s; }
  .resumo-nav:hover { color: var(--texto); border-color: var(--dim); }
  .resumo-nav.ativo { color: var(--roxo); border-color: var(--roxo); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar"></div>
  <div class="navbar" id="navbar"></div>
  <div class="barra-wrap"><div class="barra" id="barra"></div></div>
  <div class="topo"><span id="contador"></span><span class="placar" id="placar"></span></div>
  <div class="card" id="card"></div>
</div>

<script>
  /* =========================== MODO FÁCIL (18) =========================== */
  const facil = [
    { tema: "Pandas · o que é", pergunta: "Para que serve a biblioteca <b>Pandas</b> em Python?",
      opcoes: [
        "Para análise e manipulação de dados — carregar, explorar, limpar e transformar tabelas de dados de forma eficiente.",
        "Para criar interfaces gráficas e telas de aplicativos desktop, definindo botões, janelas e menus do programa.",
        "Para treinar redes neurais e modelos de inteligência artificial diretamente, sem precisar de nenhuma outra biblioteca.",
        "Para gerenciar o sistema operacional, controlando processos, arquivos e permissões da máquina onde o código roda."
      ], correta: 0, explicacao: "Pandas é a biblioteca padrão de análise de dados em Python: manipula, explora e transforma tabelas (DataFrames e Series)." },
    { tema: "Vetor · NumPy", pergunta: "O que é um <b>vetor</b> (1 dimensão) no NumPy?",
      opcoes: [
        "Uma sequência de dados em uma única dimensão — só tem comprimento, com shape no formato <code>(n,)</code>.",
        "Uma estrutura de duas dimensões, com linhas e colunas, usada para representar tabelas completas de dados.",
        "Um dicionário que associa cada chave a um valor, permitindo acesso aos dados apenas por nome, nunca por posição.",
        "Um gráfico de setas que representa direção e sentido, usado somente para cálculos de física e geometria."
      ], correta: 0, explicacao: "Vetor = 1 dimensão, só comprimento, shape <code>(n,)</code>. É um <code>ndarray</code> do NumPy com um único tipo de dado." },
    { tema: "Matriz · NumPy", pergunta: "Qual é o shape de uma <b>matriz</b> (2 dimensões) no NumPy?",
      opcoes: [
        "<code>(linhas, colunas)</code>, pois a matriz organiza os dados em duas dimensões: linhas e colunas.",
        "<code>(n,)</code>, exatamente igual ao de um vetor, já que matriz e vetor são a mesma estrutura no NumPy.",
        "<code>(colunas,)</code>, informando apenas a quantidade de colunas, pois o número de linhas é sempre igual a 1.",
        "<code>(0, 0)</code> sempre, pois o shape de uma matriz só é calculado depois que ela é preenchida com dados."
      ], correta: 0, explicacao: "Matriz 2D tem shape <code>(linhas, colunas)</code>. O acesso exige dois índices: <code>matriz[linha, coluna]</code>." },
    { tema: "Series", pergunta: "O que é uma <code>pd.Series</code> no Pandas?",
      opcoes: [
        "Um vetor rotulado: os dados (values) acompanhados de um índice (index) que dá um nome a cada posição.",
        "Uma tabela completa com várias colunas e linhas, equivalente a uma planilha inteira do Excel.",
        "Uma função que gera números aleatórios em sequência para preencher testes de análise de dados.",
        "Um tipo de gráfico de linha usado para exibir a evolução de um valor ao longo do tempo."
      ], correta: 0, explicacao: "Series = um vetor NumPy \"turbinado\" com um índice. Tem <code>values</code> (dados), <code>index</code> (rótulos) e <code>name</code> (nome opcional)." },
    { tema: "Series · index", pergunta: "Numa Series, o que é o <b>index</b>?",
      opcoes: [
        "O rótulo (nome) de cada posição da estrutura — permite acessar um valor por nome, não só por posição.",
        "O valor máximo armazenado na Series, calculado automaticamente pelo Pandas na hora da criação.",
        "O tipo de dado da Series (int, float, string), definido uma única vez para toda a estrutura.",
        "A quantidade total de elementos da Series, equivalente ao resultado da função <code>len()</code>."
      ], correta: 0, explicacao: "O <code>index</code> são os rótulos de cada posição. Ex.: em vez de acessar pela posição 3, você acessa pelo rótulo \"Diego\"." },
    { tema: "head", pergunta: "O que o método <code>df.head()</code> faz?",
      opcoes: [
        "Mostra as primeiras linhas do DataFrame, para uma visão rápida da estrutura dos dados.",
        "Mostra as últimas linhas do DataFrame, exibindo os registros mais recentes da tabela.",
        "Remove o cabeçalho (nomes das colunas) do DataFrame, deixando apenas os valores puros.",
        "Retorna o número total de linhas do DataFrame, funcionando como um contador de registros."
      ], correta: 0, explicacao: "<code>head()</code> mostra as primeiras linhas. Para as últimas, use <code>tail()</code>." },
    { tema: "tail", pergunta: "O que o método <code>df.tail()</code> faz?",
      opcoes: [
        "Mostra as últimas linhas do DataFrame.",
        "Mostra as primeiras linhas do DataFrame, igual ao <code>head()</code>, apenas com outro nome.",
        "Ordena o DataFrame do maior para o menor valor da última coluna existente na tabela.",
        "Apaga as últimas linhas do DataFrame permanentemente, reduzindo o tamanho da tabela."
      ], correta: 0, explicacao: "<code>tail()</code> mostra as últimas linhas. O oposto de <code>head()</code>." },
    { tema: "info", pergunta: "O que o método <code>df.info()</code> mostra?",
      opcoes: [
        "Um resumo das colunas e seus tipos de dados, além da contagem de valores não nulos.",
        "Apenas o número de linhas e colunas do DataFrame, sem nenhuma outra informação adicional.",
        "As estatísticas descritivas (média, desvio, mínimo, máximo) de cada coluna numérica da tabela.",
        "O conteúdo completo de todas as linhas e colunas do DataFrame, exibindo a tabela inteira na tela."
      ], correta: 0, explicacao: "<code>info()</code> resume as colunas, seus tipos e a contagem de não nulos. Para estatísticas use <code>describe()</code>." },
    { tema: "describe", pergunta: "O que o método <code>df.describe()</code> retorna?",
      opcoes: [
        "Estatísticas descritivas das colunas numéricas: contagem, média, desvio padrão, mínimo, máximo e quartis.",
        "Uma descrição em texto do que o DataFrame representa, escrita automaticamente pelo Pandas.",
        "A lista dos nomes de todas as colunas do DataFrame, uma embaixo da outra, sem valores.",
        "O tipo de dado de cada coluna (int, float, object), sem nenhum cálculo estatístico envolvido."
      ], correta: 0, explicacao: "<code>describe()</code> traz estatísticas descritivas (média, desvio, min, max, quartis) das colunas numéricas." },
    { tema: "shape", pergunta: "O que <code>df.shape</code> retorna?",
      opcoes: [
        "A quantidade de linhas e colunas do DataFrame, na forma de uma tupla <code>(linhas, colunas)</code>.",
        "O formato do gráfico que será desenhado a partir dos dados do DataFrame na tela.",
        "O tipo de cada coluna do DataFrame, indicando se é numérica, texto ou data.",
        "Apenas o número de colunas do DataFrame, sem informar a quantidade de linhas."
      ], correta: 0, explicacao: "<code>shape</code> devolve <code>(linhas, colunas)</code> — a quantidade de linhas e colunas da tabela." },
    { tema: "columns", pergunta: "O que <code>df.columns</code> retorna?",
      opcoes: [
        "A lista dos nomes das colunas do DataFrame.",
        "A soma de todos os valores de cada coluna do DataFrame, coluna por coluna.",
        "O número total de colunas do DataFrame, como um único valor inteiro.",
        "Os valores da primeira coluna do DataFrame, do primeiro ao último registro."
      ], correta: 0, explicacao: "<code>columns</code> lista os nomes das colunas da tabela." },
    { tema: "loc", pergunta: "Como o <code>df.loc[]</code> seleciona os dados?",
      opcoes: [
        "Pelo rótulo (nome) explícito do índice — ex.: <code>notas.loc[\"Ana\"]</code>.",
        "Pela posição inteira (0, 1, 2...) na memória, ignorando totalmente os rótulos do índice.",
        "Por ordem alfabética dos valores, sempre retornando o primeiro em ordem crescente.",
        "Por uma busca aleatória entre todas as linhas, escolhendo uma qualquer a cada chamada."
      ], correta: 0, explicacao: "<code>loc[]</code> seleciona pelo rótulo (nome) do índice. Já <code>iloc[]</code> seleciona pela posição inteira." },
    { tema: "iloc", pergunta: "Como o <code>df.iloc[]</code> seleciona os dados?",
      opcoes: [
        "Pela posição inteira (0, 1, 2...) na memória — ex.: <code>notas.iloc[0]</code>.",
        "Pelo rótulo (nome) do índice, exatamente igual ao <code>loc[]</code>, apenas com outro nome.",
        "Pelo valor da coluna, retornando a primeira linha cujo dado corresponde ao que foi buscado.",
        "Por uma condição lógica escrita entre os colchetes, funcionando como um filtro booleano."
      ], correta: 0, explicacao: "<code>iloc[]</code> seleciona pela posição inteira (0, 1, 2...). Já <code>loc[]</code> usa o rótulo." },
    { tema: "NaN", pergunta: "No Pandas, o que representa o valor <b>NaN</b>?",
      opcoes: [
        "Uma falha ou ausência de dado (\"Not a Number\") — informação que não existe ou não foi coletada.",
        "Um valor igual a zero, usado como padrão sempre que uma coluna numérica é criada vazia.",
        "O maior número possível que o Pandas consegue armazenar em uma célula da tabela.",
        "Um texto com a palavra literal \"NaN\" digitada pelo usuário em uma célula da planilha."
      ], correta: 0, explicacao: "NaN (Not a Number) representa uma falha/ausência de dado. Dados reais raramente são perfeitos — o NaN marca os buracos." },
    { tema: "fillna", pergunta: "O que o método <code>df.fillna(0)</code> faz?",
      opcoes: [
        "Preenche os valores ausentes (NaN) com o valor informado — nesse caso, com 0.",
        "Remove todas as linhas que contêm valores ausentes (NaN) do DataFrame.",
        "Identifica e conta quantos valores ausentes existem em cada coluna da tabela.",
        "Substitui todos os valores da tabela por 0, apagando os dados originais existentes."
      ], correta: 0, explicacao: "<code>fillna(x)</code> preenche os buracos (NaN) com o valor <code>x</code>. Para remover linhas com NaN, usa-se <code>dropna()</code>." },
    { tema: "groupby", pergunta: "Para que serve o método <code>df.groupby()</code>?",
      opcoes: [
        "Para agrupar os dados por uma coluna (ex.: categoria), permitindo depois somar ou tirar média por grupo.",
        "Para juntar dois DataFrames diferentes em uma única tabela, combinando suas linhas.",
        "Para ordenar as linhas do DataFrame em grupos de tamanho fixo, de cima para baixo.",
        "Para remover as colunas duplicadas do DataFrame, mantendo apenas uma de cada grupo."
      ], correta: 0, explicacao: "<code>groupby('categoria')</code> agrupa os dados por essa coluna — depois se aplica <code>sum()</code>, <code>mean()</code>, <code>count()</code> etc. por grupo." },
    { tema: "sort_values", pergunta: "O que o método <code>df.sort_values('idade')</code> faz?",
      opcoes: [
        "Ordena as linhas do DataFrame com base nos valores da coluna informada (nesse caso, idade).",
        "Soma todos os valores da coluna idade e retorna o total como um único número.",

<span class="destaque">pd.Series([7, 8], index=["Ana", "Bruno"])</span>
<p>Sem informar o index, o Pandas gera numeração automática: 0, 1, 2, 3...</p>
<p><b>A partir de dicionário:</b> forma mais orgânica.</p>
<span class="destaque">pd.Series({"BH": 22, "SP": 19})</span>
<p>As chaves ("BH", "SP") viram o índice; os valores (22, 19) viram os dados.</p>` },
    { titulo: "Acessando valores: loc vs iloc", tag: "a dica de ouro", corpo: `<p>Três formas de acessar, mas só duas recomendadas:</p>
<span class="destaque">.loc[] → pelo rótulo (nome). Ex.: notas.loc["Ana"]<br>.iloc[] → pela posição inteira. Ex.: notas.iloc[0]<br>[] → tenta adivinhar o contexto (pode confundir)</span>
<p><b>Dica de Ouro:</b> use sempre <code>loc</code> ou <code>iloc</code>. Deixa o código à prova de bugs e legível. Os dois também servem para <b>atribuir</b> valores.</p>` },
    { titulo: "A inteligência do Pandas", tag: "3 superpoderes", corpo: `<p><b>Estatísticas nativas:</b> a Series tem dezenas de métodos diretos e otimizados — <code>notas.mean()</code>, <code>notas.max()</code> rodam em microssegundos.</p>
<p><b>Alinhamento por índice:</b> ao somar duas Series, o Pandas soma "Ana" com "Ana". A ordem na lista não importa — a matemática viaja acompanhada do índice.</p>
<p><b>Máscaras booleanas:</b> uma condição como <code>notas >= 7</code> gera True/False; jogá-la na Series extrai exatamente as linhas desejadas.</p>` },
    { titulo: "Lidando com ausências (NaN)", tag: "limpeza", corpo: `<p>Dados reais nunca são perfeitos: informações faltam, corrompem ou falham na coleta. O Pandas marca a falha com <b>NaN</b> (Not a Number).</p>
<span class="destaque">.isna() → identifica quem está faltando<br>.fillna(x) → preenche os buracos com 'x'<br>.dropna() → remove as linhas falhas</span>
<p><code>df.isna().sum()</code> conta os NaN por coluna. Ao somar Series, um rótulo sem par vira NaN.</p>` },
    { titulo: "Visão e transformação", tag: "métodos essenciais", corpo: `<p><b>Visão inicial:</b></p>
<span class="destaque">head() → primeiras linhas · tail() → últimas<br>info() → colunas e tipos · describe() → estatísticas<br>shape → (linhas, colunas) · columns → nomes das colunas</span>
<p><b>Limpeza/transformação:</b> <code>rename()</code> (renomeia colunas), <code>drop()</code> (remove colunas/linhas), <code>fillna()</code>, <code>isna()</code>, <code>astype()</code> (converte tipos).</p>` },
    { titulo: "Seleção, filtro e agregação", tag: "extrair e resumir", corpo: `<p><b>Selecionar/filtrar:</b> <code>loc[]</code>, <code>iloc[]</code>, filtro booleano <code>df[df['idade'] > 18]</code>, <code>sort_values()</code>.</p>
<p><b>Agregar:</b> <code>groupby()</code> agrupa por uma coluna; depois se aplica:</p>
<span class="destaque">.sum() → soma · .mean() → média<br>.median() → mediana · .count() → conta registros<br>.agg({'vendas':['sum','mean']}) → várias de uma vez</span>
<p><b>Combinar tabelas:</b> <code>merge()</code> (junta por chave), <code>concat()</code> (empilha), <code>join()</code> (pelo índice).</p>` },
    { titulo: "Fluxo comum de análise", tag: "passo a passo", corpo: `<p>A ordem lógica típica de um dia a dia de análise:</p>
<span class="destaque">head() → info() → filtro → groupby() → agg() → merge()/concat()</span>
<p>Primeiro <b>explora</b> (head, info), depois <b>filtra</b> o que interessa, <b>agrupa e resume</b> (groupby + agg) e, por fim, <b>combina</b> tabelas quando precisa. Pequenos comandos, grandes insights.</p>` },
    { titulo: "Dados e Responsabilidade", tag: "ética", corpo: `<p>Dados podem <b>subverter o senso comum</b> e revelar padrões invisíveis (ex.: John Snow mapeou a cólera em 1854 e provou que a doença vinha da água, não do ar).</p>
<p>Mas também podem <b>sistematizar o preconceito</b>:</p>
<span class="destaque">Viés algorítmico → a IA aprende o preconceito dos dados históricos (55% da origem do viés)<br>Fim da privacidade → coleta massiva vira vigilância<br>Manipulação visual → mudar a escala do eixo distorce a percepção</span>
<p>A reflexão final: <b>"Dados não tomam decisões éticas. Pessoas tomam."</b></p>` }
  ];

  const modos = {
    facil:   { nome: "Fácil",   tipo: "quiz",   questoes: facil },
    medio:   { nome: "Médio",   tipo: "quiz",   questoes: medio },
    dificil: { nome: "Difícil", tipo: "quiz",   questoes: dificil },
    codigo:  { nome: "Código",  tipo: "quiz",   questoes: codigo },
    resumo:  { nome: "Resumo",  tipo: "resumo", questoes: resumo }
  };

  const temasChips = ["NumPy", "Series", "loc/iloc", "DataFrame", "groupby", "merge/concat", "NaN", "Ética de dados"];

  let modoAtual = null, questoes = [], atual = 0, acertos = 0, ordemAtual = [], respondida = false, erros = [], iniciado = false, respostasDadas = [];

  const navbar = document.getElementById("navbar");
  const card = document.getElementById("card");
  const barra = document.getElementById("barra");
  const contador = document.getElementById("contador");
  const placar = document.getElementById("placar");

  function embaralhar(n) {
    const arr = [...Array(n).keys()];
    for (let i = arr.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; }
    return arr;
  }

  function renderNavbar() {
    if (!iniciado) { navbar.innerHTML = ""; return; }
    const ehResumo = modos[modoAtual].tipo === "resumo";
    const podeVoltar = atual > 0;
    navbar.innerHTML = `
      <button class="nav-btn home" onclick="telaInicial()">⌂ Início</button>
      <button class="nav-btn" onclick="voltarQuestao()" ${podeVoltar ? "" : "disabled"}>← ${ehResumo ? "Anterior" : "Questão anterior"}</button>
      <span class="nav-spacer"></span>
      <span class="nav-modo">modo: <b>${modos[modoAtual].nome}</b></span>`;
  }

  function telaInicial() {
    iniciado = false; modoAtual = null; renderNavbar();
    barra.style.width = "0%"; contador.textContent = ""; placar.textContent = "";
    card.innerHTML = `
      <div class="hero">
        <h1>&gt; Prova Python<br><span>Pandas & Análise de Dados</span></h1>
        <p class="desc">NumPy (vetores/matrizes), Series, loc/iloc, métodos de DataFrame, tratamento de NaN e ética de dados. Nos quizzes as alternativas embaralham e a explicação aparece na hora. O modo Resumo é material de estudo.</p>
        <div class="chips">${temasChips.map(t => `<span class="chip">${t}</span>`).join("")}</div>
        <div class="modos">
          <button class="modo facil" onclick="iniciar('facil')"><span class="m-icone">🟢</span><span class="m-nome">Fácil</span><span class="m-desc">18 questões · conceitos e definições básicas</span></button>
          <button class="modo medio" onclick="iniciar('medio')"><span class="m-icone">🟡</span><span class="m-nome">Médio</span><span class="m-desc">18 questões · aplicação prática dos conceitos</span></button>
          <button class="modo dificil" onclick="iniciar('dificil')"><span class="m-icone">🔴</span><span class="m-nome">Difícil</span><span class="m-desc">20 questões · mecanismos, pegadinhas e ética</span></button>
          <button class="modo codigo" onclick="iniciar('codigo')"><span class="m-icone">💻</span><span class="m-nome">Código</span><span class="m-desc">16 trechos · leia o código e acerte a saída</span></button>
          <button class="modo resumo" onclick="iniciar('resumo')"><span class="m-icone">📖</span><span class="m-nome">Resumo</span><span class="m-desc">11 tópicos · material de estudo, sem quiz</span></button>
        </div>
        <p class="dica-teclado">atalhos nos quizzes: 1–4 responde · Enter avança · ← volta</p>
      </div>`;
  }

  function iniciar(modo) {
    modoAtual = modo; questoes = modos[modo].questoes; iniciado = true;
    atual = 0; acertos = 0; erros = [];
    respostasDadas = new Array(questoes.length).fill(null);
    if (modos[modo].tipo === "resumo") mostrarResumo(); else mostrarQuestao();
  }

  function voltarQuestao() {
    if (atual === 0) return;
    atual--;
    if (modos[modoAtual].tipo === "resumo") { mostrarResumo(); return; }
    if (respostasDadas[atual] !== null) {
      const q = questoes[atual];
      if (respostasDadas[atual] === q.correta) acertos = Math.max(0, acertos - 1);
      erros = erros.filter(e => e !== q);
      respostasDadas[atual] = null;
    }
    mostrarQuestao();
  }

  function mostrarQuestao() {
    const q = questoes[atual];
    respondida = false;
    ordemAtual = embaralhar(q.opcoes.length);
    renderNavbar();
    barra.style.width = `${(atual / questoes.length) * 100}%`;
    contador.textContent = `[${modos[modoAtual].nome.toLowerCase()}] questão ${String(atual + 1).padStart(2, "0")} / ${questoes.length}`;
    placar.textContent = `${acertos} acerto${acertos === 1 ? "" : "s"}`;
    const bloco = q.trecho ? `<pre>${q.trecho}</pre>` : "";
    card.innerHTML = `
      <span class="tema">◆ ${q.tema}</span>
      ${bloco}
      <div class="pergunta">${q.pergunta}</div>
      ${ordemAtual.map((idxOriginal, pos) => `
        <button class="opcao" data-pos="${pos}" onclick="responder(${idxOriginal})">
          <span class="letra">${String.fromCharCode(65 + pos)}</span>
          <span class="txt">${q.opcoes[idxOriginal]}</span>
        </button>`).join("")}
      <div class="explicacao" id="explicacao"></div>
      <button class="botao" id="proxima" onclick="proxima()">Próxima →</button>`;
  }

  function responder(idxOriginal) {
    if (respondida) return;
    respondida = true;
    const q = questoes[atual];
    respostasDadas[atual] = idxOriginal;
    const botoes = card.querySelectorAll(".opcao");
    botoes.forEach(b => b.disabled = true);
    const posCorreta = ordemAtual.indexOf(q.correta);
    const posClicada = ordemAtual.indexOf(idxOriginal);
    const acertou = idxOriginal === q.correta;
    botoes[posCorreta].classList.add("correta");
    botoes.forEach((b, i) => { if (i !== posCorreta && i !== posClicada) b.classList.add("apagada"); });
    const exp = document.getElementById("explicacao");
    if (acertou) { acertos++; exp.innerHTML = `<span class="tag">✓ ACERTOU</span>${q.explicacao}`; }
    else { botoes[posClicada].classList.add("errada"); exp.classList.add("err"); exp.innerHTML = `<span class="tag">✗ ERROU</span>${q.explicacao}`; erros.push(q); }
    exp.style.display = "block";
    const btn = document.getElementById("proxima");
    if (atual === questoes.length - 1) btn.textContent = "Ver resultado →";
    btn.classList.add("mostrar");
    placar.textContent = `${acertos} acerto${acertos === 1 ? "" : "s"}`;
  }

  function proxima() {
    atual++;
    if (atual < questoes.length) mostrarQuestao(); else mostrarResultado();
  }

  function mostrarResultado() {
    renderNavbar();
    barra.style.width = "100%";
    contador.textContent = `[${modos[modoAtual].nome.toLowerCase()}] resultado`;
    placar.textContent = "";
    const pct = Math.round((acertos / questoes.length) * 100);
    let veredito, sub;
    if (pct >= 90)      { veredito = "Monstro. 🏆";                sub = modoAtual === "dificil" ? "Pode fazer a prova de olhos fechados." : "Bora subir de nível — tenta o próximo modo."; }
    else if (pct >= 70) { veredito = "Tá pronto pra prova. 🐼";    sub = "Só dá uma olhada nos erros abaixo."; }
    else if (pct >= 50) { veredito = "Na média, mas dá pra mais."; sub = "Revisa os tópicos das questões erradas."; }
    else                { veredito = "Volta pra teoria. 📚";       sub = "Dá uma passada no modo Resumo e refaz."; }
    card.innerHTML = `
      <div class="resultado">
        <div class="anel" style="--pct: ${pct}"><span class="num">${acertos}/${questoes.length}</span><span class="sub">${pct}%</span></div>
        <p class="veredito">${veredito}</p>
        <p class="veredito-sub">${sub}</p>
        <button class="botao mostrar" onclick="iniciar(modoAtual)">Refazer ↻</button>
        <button class="botao secundario mostrar" onclick="telaInicial()">Trocar modo</button>
      </div>
      ${erros.length ? `
        <div class="revisao">
          <h3>Pra revisar (${erros.length})</h3>
          ${erros.map(q => `
            <div class="rev-item">
              <div class="q">◆ [${q.tema}] ${q.pergunta.split("<pre>")[0]}</div>
              <div class="r"><b>Resposta:</b> ${q.opcoes[q.correta]}</div>
            </div>`).join("")}
        </div>` : ""}`;
  }

  function mostrarResumo() {
    const r = resumo[atual];
    renderNavbar();
    barra.style.width = `${((atual + 1) / resumo.length) * 100}%`;
    contador.textContent = `[resumo] tópico ${String(atual + 1).padStart(2, "0")} / ${resumo.length}`;
    placar.textContent = "";
    const ehUltimo = atual === resumo.length - 1;
    card.innerHTML = `
      <div class="resumo-topo"><h2>${r.titulo}</h2><span class="resumo-tag">${r.tag}</span></div>
      <div class="resumo-corpo">${r.corpo}</div>
      <div class="resumo-lista">
        ${resumo.map((t, i) => `<button class="resumo-nav ${i === atual ? "ativo" : ""}" onclick="irResumo(${i})">${i + 1}. ${t.titulo}</button>`).join("")}
      </div>
      <button class="botao mostrar" onclick="${ehUltimo ? "telaInicial()" : "proximoResumo()"}">${ehUltimo ? "Concluir ✓" : "Próximo tópico →"}</button>`;
  }

  function proximoResumo() { if (atual < resumo.length - 1) { atual++; mostrarResumo(); } }
  function irResumo(i) { atual = i; mostrarResumo(); }

  document.addEventListener("keydown", (e) => {
    if (!iniciado) {
      const map = { "1": "facil", "2": "medio", "3": "dificil", "4": "codigo", "5": "resumo" };
      if (map[e.key]) iniciar(map[e.key]);
      return;
    }
    const tipo = modos[modoAtual].tipo;
    if (tipo === "resumo") {
      if (e.key === "ArrowRight") proximoResumo();
      else if (e.key === "ArrowLeft") voltarQuestao();
      return;
    }
    if (!respondida && ["1","2","3","4"].includes(e.key)) {
      const pos = parseInt(e.key) - 1;
      if (pos < ordemAtual.length) responder(ordemAtual[pos]);
    } else if (respondida && e.key === "Enter") { proxima(); }
    else if (e.key === "ArrowLeft") { voltarQuestao(); }
  });

  telaInicial();
</script>
</body>
</html>
